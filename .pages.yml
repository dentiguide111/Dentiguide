    path: "quiz.json"
    format: "json"
    fields:
      - name: "quizzes"
        label: "Quizzes"
        type: "object"
        list: true
        fields:
          - name: "id"
            label: "Quiz web address name (letters and hyphens)"
            type: "string"
          - name: "title"
            label: "Quiz title"
            type: "object"
            fields:
              - name: "en"
                label: "English"
                type: "string"
              - name: "ms"
                label: "Bahasa Melayu"
                type: "string"
              - name: "zh"
                label: "中文"
                type: "string"
          - name: "questions"
            label: "Questions"
            type: "object"
            list: true
            fields:
              - name: "question"
                label: "Question"
                type: "object"
                fields:
                  - name: "en"
                    label: "English"
                    type: "string"
                  - name: "ms"
                    label: "Bahasa Melayu"
                    type: "string"
                  - name: "zh"
                    label: "中文"
                    type: "string"
              - name: "options"
                label: "Answer options (one per box)"
                type: "object"
                fields:
                  - name: "en"
                    label: "English"
                    type: "string"
                    list: true
                  - name: "ms"
                    label: "Bahasa Melayu"
                    type: "string"
                    list: true
                  - name: "zh"
                    label: "中文"
                    type: "string"
                    list: true
              - name: "correct"
                label: "Correct answer number (first option is 0)"
                type: "number"
              - name: "explanation"
                label: "Explanation"
                type: "object"
                fields:
                  - name: "en"
                    label: "English"
                    type: "text"
                  - name: "ms"
                    label: "Bahasa Melayu"
                    type: "text"
                  - name: "zh"
                    label: "中文"
                    type: "text"
