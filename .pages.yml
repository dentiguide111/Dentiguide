# DentiGuide editor settings for Pages CMS (pagescms.org)
media:
  input: media
  output: /media
content:
  - name: "content_en"
    label: "English: topics and age pages"
    type: "file"
    path: "content-en.json"
    format: "json"
    fields:
      - name: "topics"
        label: "Topics"
        type: "object"
        list: true
        fields:
          - name: "id"
            label: "Topic number (do not change)"
            type: "number"
          - name: "slug"
            label: "Web address name (letters and hyphens)"
            type: "string"
          - name: "status"
            label: "Status"
            type: "select"
            options:
              values:
                - "published"
                - "draft"
          - name: "section"
            label: "Section"
            type: "select"
            options:
              values:
                - "ohe"
                - "ohi-basics"
                - "ohi-special"
                - "ohi-related"
                - "hidden"
          - name: "category"
            label: "OHE category"
            type: "select"
            options:
              values:
                - ""
                - "understanding"
                - "diseases"
                - "cancer"
                - "prevention"
                - "general"
          - name: "order"
            label: "Order in its section"
            type: "number"
          - name: "title"
            label: "Title"
            type: "string"
          - name: "bullets"
            label: "Main points (one per box; ** makes bold)"
            type: "text"
            list: true
          - name: "why_title"
            label: "Heading of the explanation box"
            type: "string"
          - name: "why"
            label: "Explanation points"
            type: "text"
            list: true
          - name: "warnings"
            label: "Warning notes"
            type: "text"
            list: true
          - name: "notes"
            label: "Extra notes"
            type: "text"
            list: true
          - name: "qa"
            label: "Questions and answers"
            type: "object"
            list: true
            fields:
              - name: "question"
                label: "Question"
                type: "string"
              - name: "answer"
                label: "Answer (plain text; ** for bold)"
                type: "text"
          - name: "media"
            label: "Photos, GIFs and videos"
            type: "object"
            list: true
            fields:
              - name: "type"
                label: "Type"
                type: "select"
                options:
                  values:
                    - "image"
                    - "gif"
                    - "video"
              - name: "file"
                label: "Photo or animation (upload here)"
                type: "image"
              - name: "video_url"
                label: "Video link (YouTube)"
                type: "string"
              - name: "caption"
                label: "Caption"
                type: "object"
                fields:
                  - name: "en"
                    label: "English"
                    type: "string"
                  - name: "ms"
                    label: "Bahasa Melayu"
                    type: "string"
                  - name: "zh"
                    label: "中文"
                    type: "string"
              - name: "alt"
                label: "Alternative text (describes the picture)"
                type: "object"
                fields:
                  - name: "en"
                    label: "English"
                    type: "string"
                  - name: "ms"
                    label: "Bahasa Melayu"
                    type: "string"
                  - name: "zh"
                    label: "中文"
                    type: "string"
              - name: "required"
                label: "What is needed"
                type: "text"
              - name: "what"
                label: "What it must show"
                type: "text"
              - name: "filename"
                label: "Suggested filename"
                type: "string"
              - name: "size"
                label: "Size or duration"
                type: "string"
              - name: "video_title"
                label: "Suggested video title"
                type: "string"
              - name: "after_question"
                label: "Show after question number (blank = top)"
                type: "number"
          - name: "review"
            label: "Clinical review"
            type: "object"
            fields:
              - name: "status"
                label: "Status"
                type: "select"
                options:
                  values:
                    - "pending"
                    - "in-review"
                    - "reviewed"
              - name: "reviewer"
                label: "Reviewed by"
                type: "string"
              - name: "date"
                label: "Review date"
                type: "string"
          - name: "references"
            label: "References"
            type: "object"
            list: true
            fields:
              - name: "title"
                label: "Title"
                type: "string"
              - name: "url"
                label: "Web link"
                type: "string"
      - name: "ages"
        label: "Age-group pages"
        type: "object"
        list: true
        fields:
          - name: "id"
            label: "Age page number (do not change)"
            type: "number"
          - name: "slug"
            label: "Web address name"
            type: "string"
          - name: "status"
            label: "Status"
            type: "select"
            options:
              values:
                - "published"
                - "draft"
          - name: "order"
            label: "Order"
            type: "number"
          - name: "title"
            label: "Title"
            type: "string"
          - name: "qa"
            label: "Questions and answers"
            type: "object"
            list: true
            fields:
              - name: "group"
                label: "Group (guide or key)"
                type: "string"
              - name: "question"
                label: "Question"
                type: "string"
              - name: "answer"
                label: "Answer (plain text; ** for bold)"
                type: "text"
          - name: "notes"
            label: "Extra notes"
            type: "text"
            list: true
          - name: "media"
            label: "Photos, GIFs and videos"
            type: "object"
            list: true
            fields:
              - name: "type"
                label: "Type"
                type: "select"
                options:
                  values:
                    - "image"
                    - "gif"
                    - "video"
              - name: "file"
                label: "Photo or animation (upload here)"
                type: "image"
              - name: "video_url"
                label: "Video link (YouTube)"
                type: "string"
              - name: "caption"
                label: "Caption"
                type: "object"
                fields:
                  - name: "en"
                    label: "English"
                    type: "string"
                  - name: "ms"
                    label: "Bahasa Melayu"
                    type: "string"
                  - name: "zh"
                    label: "中文"
                    type: "string"
              - name: "alt"
                label: "Alternative text (describes the picture)"
                type: "object"
                fields:
                  - name: "en"
                    label: "English"
                    type: "string"
                  - name: "ms"
                    label: "Bahasa Melayu"
                    type: "string"
                  - name: "zh"
                    label: "中文"
                    type: "string"
              - name: "required"
                label: "What is needed"
                type: "text"
              - name: "what"
                label: "What it must show"
                type: "text"
              - name: "filename"
                label: "Suggested filename"
                type: "string"
              - name: "size"
                label: "Size or duration"
                type: "string"
              - name: "video_title"
                label: "Suggested video title"
                type: "string"
              - name: "after_question"
                label: "Show after question number (blank = top)"
                type: "number"
          - name: "review"
            label: "Clinical review"
            type: "object"
            fields:
              - name: "status"
                label: "Status"
                type: "select"
                options:
                  values:
                    - "pending"
                    - "in-review"
                    - "reviewed"
              - name: "reviewer"
                label: "Reviewed by"
                type: "string"
              - name: "date"
                label: "Review date"
                type: "string"
          - name: "references"
            label: "References"
            type: "object"
            list: true
            fields:
              - name: "title"
                label: "Title"
                type: "string"
              - name: "url"
                label: "Web link"
                type: "string"
