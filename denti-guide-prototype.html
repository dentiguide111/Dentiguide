en:{n:['Dental Caries','Gum Disease','Diet and Oral Health','Tobacco and Vaping','Diabetes and Oral Health'],ren:['Oral Health and Dental Diseases','Diabetes'],sr:'Sources:',cap:['Healthy','Early decay','Cavity'],sites:'<b>Common sites:</b> the sides and underside of the tongue, the floor of the mouth, the inner cheeks, the gums, the lips and the roof of the mouth.',early:'<b>Why early detection matters:</b> oral cancer found early is usually easier to treat and has better outcomes. Many early changes cause no pain, so regular dental check-ups and Mouth Self-Examination (MSE) are important.',lab:{oe:'Oral Health Education (OHE)',oi:'Oral Hygiene Instruction (OHI)',hoe:'Knowledge, awareness and prevention: oral cancer, dental caries, gum disease, diet, tobacco and more.',hoi:'Practical oral hygiene: basics, brushing and cleaning by age group, and special oral care.',ohd:'Learn about oral health, how diseases develop, risk factors and healthy behaviours.',oid:'Practical, step-by-step guidance for daily oral care.',oth:'Other oral health awareness topics'},m:{20:['<b>What is dental caries?</b> Dental caries (tooth decay) is damage to a tooth caused by acids that are made when bacteria in plaque break down sugars.','<b>How it develops:</b> frequent sugary foods and drinks, poor plaque removal and too little fluoride allow acid attacks to wear away the enamel. Early decay can appear as white spots and may be reversed with fluoride and good care.','<b>Signs:</b> white or brown spots, holes in the teeth, sensitivity to sweet, hot or cold, and toothache. Early decay often causes no pain.','<b>Who is at risk:</b> anyone who has sugary snacks or drinks often, has a dry mouth, does not clean the teeth well or has exposed tooth roots.','<b>Prevention:</b> brush twice a day with fluoride toothpaste, keep sugary foods and drinks to mealtimes, clean between your teeth and have regular dental check-ups.','<b>When to seek professional help:</b> see your dentist if you notice spots, holes or toothache. Early treatment is simpler and saves more of the natural tooth.'],21:['<b>What is gum disease?</b> Gum disease is an infection and inflammation of the tissues that support the teeth. It starts as gingivitis and can progress to periodontitis.','<b>Gingivitis:</b> red, swollen gums that bleed easily when brushing. It can be reversed with good oral hygiene.','<b>Periodontitis:</b> damage to the gum attachment and the bone around the teeth. It may cause receding gums, loose teeth and bad breath, and it needs professional treatment.','<b>Risk factors:</b> plaque build-up, smoking and tobacco use, diabetes, pregnancy and other hormonal changes, some medicines and a family history of gum disease.','<b>Prevention:</b> remove plaque every day by brushing and cleaning between your teeth, do not smoke, keep diabetes under control and see your dentist regularly. Practical cleaning steps are in Oral Hygiene Instruction.','<b>When to seek professional help:</b> bleeding, swollen or receding gums, loose teeth, or bad breath that does not go away.'],22:['<b>Sugar and teeth:</b> each time you eat or drink sugar, bacteria in plaque make acid that attacks the teeth.','<b>How often matters:</b> frequent snacking and sipping sweet drinks cause more acid attacks than sugar eaten as part of a meal.','<b>Choose:</b> water as your main drink, and fresh fruit, vegetables, plain milk or unsweetened yoghurt as snacks.','<b>Limit:</b> sweetened drinks (including sweetened tea and coffee, soft drinks and packaged juices), sweets, biscuits and sticky foods, especially between meals and at bedtime.','<b>Acidic drinks</b> such as fizzy drinks, energy drinks and some fruit juices can wear away enamel. Do not brush straight after having them.','<b>Babies and young children:</b> do not add sugar to food or drinks, and do not put a baby to bed with a bottle of milk or a sweet drink.'],23:['<b>Smoking and tobacco:</b> cigarettes, cigars and smokeless tobacco increase the risk of gum disease, tooth loss, stained teeth, bad breath and oral cancer.','<b>Vaping (e-cigarettes):</b> vaping is not risk-free for the mouth. It can dry the mouth and irritate the gums, and it may contain nicotine, which is addictive. Its long-term effects are still being studied.','<b>Betel quid and areca nut:</b> chewing them also raises the risk of oral cancer and gum problems.','<b>Warning signs:</b> gums that bleed or recede, white or red patches, ulcers that do not heal and ongoing bad breath. See your dentist if you notice them.','<b>Quitting helps:</b> stopping tobacco improves gum health and lowers the risk of oral cancer over time. Ask your clinic about help to quit.'],24:['<b>The two-way link:</b> people with diabetes are more likely to develop gum disease, and severe gum disease can make blood sugar harder to control.','<b>Why this happens:</b> high blood sugar makes it harder for the body to fight infection, and diabetes can reduce saliva.','<b>Other mouth problems:</b> dry mouth, mouth sores that heal slowly and fungal infections such as oral thrush.','<b>Prevention:</b> keep blood sugar well controlled, follow your doctor’s advice, do not smoke and have regular dental check-ups.','<b>When to seek professional help:</b> bleeding or swollen gums, loose teeth, persistent bad breath, dry mouth or mouth sores that heal slowly. Daily cleaning advice is in Oral Hygiene Instruction › Special Oral Care › Diabetes.','!References for this topic: pending clinical review by the dental team.']},w:{20:['Dental caries is one of the most common oral diseases worldwide, and it is largely preventable.','Untreated decay can cause pain, infection and tooth loss.','Home care and regular check-ups work together.'],21:['Early gum disease often causes no pain.','Gingivitis can be reversed. Periodontitis can be controlled but the lost support cannot be fully regained.','Gum disease is a major cause of tooth loss in adults.'],22:['How often you have sugar matters as much as how much.','Healthy eating supports healthy teeth and gums.','Water helps wash away food and keeps the mouth moist.'],23:['Tobacco reduces blood flow in the gums and slows healing.','The nicotine in vapes is addictive.','It is never too late to quit.'],24:['Gum health and blood sugar affect each other.','Early dental care helps protect your general health.']}},
ms:{n:['Karies Gigi','Penyakit Gusi','Diet dan Kesihatan Mulut','Tembakau dan Vaping','Diabetes dan Kesihatan Mulut'],ren:['Kesihatan Mulut dan Penyakit Pergigian','Diabetes'],sr:'Sumber:',cap:['Sihat','Karies awal','Berlubang'],sites:'<b>Lokasi biasa:</b> sisi dan bahagian bawah lidah, lantai mulut, pipi bahagian dalam, gusi, bibir dan lelangit.',early:'<b>Mengapa pengesanan awal penting:</b> kanser mulut yang dikesan awal biasanya lebih mudah dirawat dan hasilnya lebih baik. Banyak perubahan awal tidak menyebabkan sakit, jadi pemeriksaan pergigian berkala dan Pemeriksaan Mulut Kendiri (MSE) adalah penting.',lab:{oe:'Pendidikan Kesihatan Mulut (OHE)',oi:'Arahan Kebersihan Mulut (OHI)',hoe:'Pengetahuan, kesedaran dan pencegahan: kanser mulut, karies gigi, penyakit gusi, diet, tembakau dan banyak lagi.',hoi:'Kebersihan mulut secara praktikal: asas, cara memberus dan membersihkan mengikut kumpulan umur, serta penjagaan mulut khas.',ohd:'Ketahui tentang kesihatan mulut, cara penyakit berlaku, faktor risiko dan tabiat yang sihat.',oid:'Panduan praktikal langkah demi langkah untuk penjagaan mulut harian.',oth:'Topik kesedaran kesihatan mulut yang lain'},m:{20:['<b>Apakah karies gigi?</b> Karies gigi (gigi reput) ialah kerosakan pada gigi yang disebabkan oleh asid yang dihasilkan apabila bakteria dalam plak memecahkan gula.','<b>Bagaimana ia berlaku:</b> makanan dan minuman bergula yang kerap, plak yang tidak dibuang dengan baik dan fluorida yang tidak mencukupi membolehkan serangan asid menghakis enamel. Karies awal boleh kelihatan sebagai tompok putih dan boleh dipulihkan dengan fluorida dan penjagaan yang baik.','<b>Tanda-tanda:</b> tompok putih atau coklat, lubang pada gigi, kepekaan terhadap makanan manis, panas atau sejuk, dan sakit gigi. Karies awal selalunya tidak menyebabkan sakit.','<b>Siapa yang berisiko:</b> sesiapa yang kerap mengambil snek atau minuman bergula, mengalami mulut kering, tidak membersihkan gigi dengan baik atau mempunyai akar gigi yang terdedah.','<b>Pencegahan:</b> berus gigi dua kali sehari dengan ubat gigi berfluorida, hadkan makanan dan minuman bergula pada waktu makan, bersihkan celah gigi dan jalani pemeriksaan pergigian berkala.','<b>Bilakah perlu mendapatkan bantuan profesional:</b> berjumpa doktor pergigian jika anda perasan tompok, lubang atau sakit gigi. Rawatan awal lebih mudah dan menyelamatkan lebih banyak struktur gigi asli.'],21:['<b>Apakah penyakit gusi?</b> Penyakit gusi ialah jangkitan dan keradangan pada tisu yang menyokong gigi. Ia bermula sebagai gingivitis dan boleh berkembang menjadi periodontitis.','<b>Gingivitis:</b> gusi merah dan bengkak yang mudah berdarah semasa memberus. Ia boleh dipulihkan dengan kebersihan mulut yang baik.','<b>Periodontitis:</b> kerosakan pada perlekatan gusi dan tulang di sekeliling gigi. Ia boleh menyebabkan gusi surut, gigi goyang dan nafas berbau, dan memerlukan rawatan profesional.','<b>Faktor risiko:</b> pengumpulan plak, merokok dan penggunaan tembakau, diabetes, kehamilan dan perubahan hormon yang lain, sesetengah ubat dan sejarah keluarga penyakit gusi.','<b>Pencegahan:</b> buang plak setiap hari dengan memberus dan membersihkan celah gigi, jangan merokok, kawal diabetes dan berjumpa doktor pergigian secara berkala. Langkah pembersihan praktikal terdapat dalam Arahan Kebersihan Mulut.','<b>Bilakah perlu mendapatkan bantuan profesional:</b> gusi berdarah, bengkak atau surut, gigi goyang, atau nafas berbau yang tidak hilang.'],22:['<b>Gula dan gigi:</b> setiap kali anda makan atau minum gula, bakteria dalam plak menghasilkan asid yang menyerang gigi.','<b>Kekerapan adalah penting:</b> makan snek dan menghirup minuman manis dengan kerap menyebabkan lebih banyak serangan asid berbanding gula yang diambil bersama hidangan.','<b>Pilihan yang baik:</b> air sebagai minuman utama, dan buah-buahan segar, sayur-sayuran, susu tawar atau yogurt tanpa gula sebagai snek.','<b>Hadkan:</b> minuman bermanis (termasuk teh dan kopi bermanis, minuman berkarbonat dan jus dalam bungkusan), gula-gula, biskut dan makanan yang melekit, terutamanya di antara waktu makan dan sebelum tidur.','<b>Minuman berasid</b> seperti minuman berkarbonat, minuman bertenaga dan sesetengah jus buah boleh menghakis enamel. Jangan terus memberus gigi selepas meminumnya.','<b>Bayi dan kanak-kanak kecil:</b> jangan tambah gula pada makanan atau minuman, dan jangan biarkan bayi tidur dengan botol susu atau minuman manis.'],23:['<b>Merokok dan tembakau:</b> rokok, cerut dan tembakau tanpa asap meningkatkan risiko penyakit gusi, gigi tanggal, gigi bernoda, nafas berbau dan kanser mulut.','<b>Vaping (rokok elektronik):</b> vaping tidak bebas risiko kepada mulut. Ia boleh mengeringkan mulut dan merengsa gusi, dan mungkin mengandungi nikotin yang menagihkan. Kesan jangka panjangnya masih dikaji.','<b>Sirih dan pinang:</b> mengunyahnya juga meningkatkan risiko kanser mulut dan masalah gusi.','<b>Tanda amaran:</b> gusi yang berdarah atau surut, tompok putih atau merah, ulser yang tidak sembuh dan nafas berbau yang berterusan. Berjumpa doktor pergigian jika anda perasan tanda-tanda ini.','<b>Berhenti memberi manfaat:</b> berhenti menggunakan tembakau memperbaik kesihatan gusi dan mengurangkan risiko kanser mulut dari semasa ke semasa. Tanya klinik anda tentang bantuan untuk berhenti.'],24:['<b>Hubungan dua hala:</b> orang yang menghidap diabetes lebih berisiko mendapat penyakit gusi, dan penyakit gusi yang teruk boleh menyukarkan kawalan gula dalam darah.','<b>Mengapa ini berlaku:</b> gula darah yang tinggi menyukarkan badan melawan jangkitan, dan diabetes boleh mengurangkan air liur.','<b>Masalah mulut yang lain:</b> mulut kering, luka mulut yang lambat sembuh dan jangkitan kulat seperti sariawan mulut.','<b>Pencegahan:</b> kawal gula darah dengan baik, ikut nasihat doktor anda, jangan merokok dan jalani pemeriksaan pergigian berkala.','<b>Bilakah perlu mendapatkan bantuan profesional:</b> gusi berdarah atau bengkak, gigi goyang, nafas berbau yang berterusan, mulut kering atau luka mulut yang lambat sembuh. Nasihat pembersihan harian terdapat dalam Arahan Kebersihan Mulut › Penjagaan Mulut Khas › Diabetes.','!Rujukan bagi topik ini: menunggu semakan klinikal oleh pasukan pergigian.']},w:{20:['Karies gigi ialah salah satu penyakit mulut yang paling biasa di seluruh dunia, dan sebahagian besarnya boleh dicegah.','Karies yang tidak dirawat boleh menyebabkan sakit, jangkitan dan gigi tanggal.','Penjagaan di rumah dan pemeriksaan berkala berfungsi bersama.'],21:['Penyakit gusi pada peringkat awal selalunya tidak menyebabkan sakit.','Gingivitis boleh dipulihkan. Periodontitis boleh dikawal tetapi kehilangan sokongan gigi tidak dapat dipulihkan sepenuhnya.','Penyakit gusi ialah punca utama gigi tanggal pada orang dewasa.'],22:['Kekerapan pengambilan gula sama penting dengan jumlahnya.','Pemakanan yang sihat menyokong gigi dan gusi yang sihat.','Air membantu membasuh sisa makanan dan memastikan mulut lembap.'],23:['Tembakau mengurangkan aliran darah ke gusi dan melambatkan penyembuhan.','Nikotin dalam vape menagihkan.','Tidak pernah terlambat untuk berhenti.'],24:['Kesihatan gusi dan gula darah saling mempengaruhi.','Penjagaan pergigian awal membantu melindungi kesihatan am anda.']}},
zh:{n:['龋齿（蛀牙）','牙龈疾病','饮食与口腔健康','烟草与电子烟','糖尿病与口腔健康'],ren:['口腔健康与牙科疾病','糖尿病'],sr:'资料来源：',cap:['健康','早期蛀牙','蛀洞'],sites:'<b>常见部位：</b>舌头两侧和舌下、口底、脸颊内侧、牙龈、嘴唇和上颚。',early:'<b>为什么及早发现很重要：</b>及早发现的口腔癌通常更容易治疗，效果也更好。许多早期变化并不疼痛，所以定期做牙科检查和口腔自我检查（MSE）很重要。',lab:{oe:'口腔健康教育（OHE）',oi:'口腔卫生指导（OHI）',hoe:'知识、认知与预防：口腔癌、龋齿、牙龈疾病、饮食、烟草等。',hoi:'实用的口腔卫生：基础知识、按年龄组的刷牙与清洁方法，以及特殊口腔护理。',ohd:'了解口腔健康、疾病如何发生、风险因素和健康行为。',oid:'日常口腔护理的实用分步指导。',oth:'其他口腔健康认知主题'},m:{20:['<b>什么是龋齿？</b>龋齿（蛀牙）是牙菌斑中的细菌分解糖分时产生的酸对牙齿造成的损害。','<b>如何发生：</b>经常吃喝含糖食物、牙菌斑清除不彻底、氟不足，都会让酸的攻击慢慢磨损牙釉质。早期蛀牙可表现为白色斑点，通过氟和良好的护理可能逆转。','<b>症状：</b>白色或褐色斑点、牙齿上的洞、对甜、热、冷敏感，以及牙痛。早期蛀牙往往没有疼痛。','<b>哪些人风险较高：</b>经常吃甜食零食或喝含糖饮料、口干、牙齿清洁不佳或牙根外露的人。','<b>预防：</b>每天用含氟牙膏刷牙两次，把含糖食物和饮料安排在正餐时间，清洁牙缝，并定期做牙科检查。','<b>何时寻求专业帮助：</b>发现斑点、牙洞或牙痛时请看牙医。及早治疗更简单，也能保留更多天然牙。'],21:['<b>什么是牙龈疾病？</b>牙龈疾病是支撑牙齿的组织发生的感染和炎症。它从牙龈炎开始，可能发展为牙周炎。','<b>牙龈炎：</b>牙龈发红、肿胀，刷牙时容易出血。良好的口腔卫生可以使其逆转。','<b>牙周炎：</b>牙龈附着和牙齿周围的骨头受到破坏，可能导致牙龈退缩、牙齿松动和口臭，需要专业治疗。','<b>风险因素：</b>牙菌斑堆积、吸烟和使用烟草、糖尿病、孕期及其他激素变化、某些药物，以及牙龈疾病家族史。','<b>预防：</b>每天通过刷牙和清洁牙缝清除牙菌斑，不吸烟，控制糖尿病，并定期看牙医。实用的清洁步骤见“口腔卫生指导”。','<b>何时寻求专业帮助：</b>牙龈出血、肿胀或退缩，牙齿松动，或口臭持续不消。'],22:['<b>糖与牙齿：</b>每次吃或喝含糖食物，牙菌斑中的细菌都会产生酸来攻击牙齿。','<b>次数很重要：</b>频繁吃零食和小口小口地喝甜饮料，比在正餐中摄入的糖造成更多次酸攻击。','<b>推荐：</b>以清水为主要饮品，零食选择新鲜水果、蔬菜、无糖鲜奶或无糖酸奶。','<b>少吃少喝：</b>含糖饮料（包括加糖的茶和咖啡、汽水和包装果汁）、糖果、饼干和黏性食物，尤其是两餐之间和睡前。','<b>酸性饮品</b>如碳酸饮料、能量饮料和某些果汁会磨损牙釉质。喝完后不要立刻刷牙。','<b>婴幼儿：</b>不要在食物或饮料中加糖，也不要让宝宝含着奶瓶或甜饮料入睡。'],23:['<b>吸烟和烟草：</b>香烟、雪茄和无烟烟草会增加牙龈疾病、掉牙、牙齿染色、口臭和口腔癌的风险。','<b>电子烟：</b>电子烟对口腔并非没有风险。它可能使口腔干燥、刺激牙龈，而且可能含有会成癫的尼古丁。其长期影响仍在研究中。','<b>槟榔和槟榔果：</b>嚼食槟榔也会增加口腔癌和牙龈问题的风险。','<b>警示信号：</b>牙龈出血或退缩、白色或红色斑块、久不愈合的溃疡和持续口臭。发现这些情况请看牙医。','<b>戒烟有益：</b>戒除烟草可改善牙龈健康，并随时间降低口腔癌风险。可向诊所咨询戒烟帮助。'],24:['<b>双向关系：</b>糖尿病患者更容易患牙龈疾病，而严重的牙龈疾病也会使血糖更难控制。','<b>原因：</b>血糖过高会使身体更难抵抗感染，而且糖尿病可能使唾液减少。','<b>其他口腔问题：</b>口干、口腔伤口愈合缓慢，以及鹅口疮等真菌感染。','<b>预防：</b>把血糖控制好，遵从医生建议，不吸烟，并定期做牙科检查。','<b>何时寻求专业帮助：</b>牙龈出血或肿胀、牙齿松动、持续口臭、口干或口腔伤口愈合缓慢。日常清洁建议见“口腔卫生指导 › 特殊口腔护理 › 糖尿病”。','!本主题的参考资料：有待牙科团队临床审核。']},w:{20:['龋齿是全球最常见的口腔疾病之一，而且在很大程度上是可以预防的。','未经治疗的蛀牙可能导致疼痛、感染和掉牙。','在家护理和定期检查相辅相成。'],21:['牙龈疾病早期往往没有疼痛。','牙龈炎可以逆转。牙周炎可以控制，但已经丧失的支持组织无法完全恢复。','牙龈疾病是成年人掉牙的主要原因之一。'],22:['吃糖的次数与吃糖的多少同样重要。','健康的饮食有助于牙齿和牙龈健康。','清水有助于冲走食物残渣，并保持口腔湿润。'],23:['烟草会减少牙龈的血液流动，延缓愈合。','电子烟中的尼古丁会成癫。','什么时候戒烟都不迟。'],24:['牙龈健康和血糖会相互影响。','及早的牙科护理有助于保护您的整体健康。']}}};

en:{n:['Brushing Techniques','Dental Floss: Types and Choice','Interdental Cleaning','Mouthwash','Tongue Cleaning and Other Aids','Daily Oral Hygiene Routine','Adaptive Toothbrushes and Aids (Special Needs/OKU)'],r1:'Toothbrushes: Choosing and Using',r3:'How to Floss',sb:'<b>See also:</b>',
m1:['<b>Manual or electric?</b> Both clean well when used properly. A powered toothbrush can help people with limited dexterity and children who need encouragement.','<b>Bristles:</b> soft, medium and hard bristles are sold. Soft bristles are recommended because they remove plaque well and are gentler on the gums and teeth. Medium and hard bristles may damage the gums and wear away tooth surfaces, especially if you brush hard.','<b>Head design:</b> choose a small to medium head that reaches the back teeth. Tapered, angled or V-shaped heads can help in some situations, but good technique matters more than design.'],
m2:['<b>Read the label:</b> look for fluoride and the amount in ppm. Most daily toothpastes contain fluoride.','<b>Sensitive teeth:</b> toothpaste made for sensitive teeth can help when used regularly. Ask your dental team if the pain does not settle.','<b>Whitening toothpaste:</b> it can remove surface stains but does not change the natural colour of teeth, and some are abrasive or cause sensitivity. Choose one that contains fluoride.','<b>High-fluoride toothpaste:</b> a stronger fluoride toothpaste may be prescribed for people at high risk of decay. Use it only on a dentist’s advice.','<b>Special conditions:</b> people with dry mouth, gum problems or other conditions may need a particular toothpaste. Ask your dentist.'],
m:{25:[],26:['<b>Why floss?</b> A toothbrush cannot reach the sides of teeth where they touch. Cleaning between your teeth once a day removes plaque from these areas.','<b>Waxed floss</b> slides easily between tight teeth and is less likely to shred. <b>Unwaxed floss</b> is thinner and suits wider spaces, but it can fray.','<b>Dental tape</b> is a flat, wider ribbon. It suits wider gaps and sensitive gums.','<b>Super floss</b> has a stiff end for threading, a spongy section and regular floss. It is useful for braces, bridges and around implants.','<b>Floss picks and holders</b> are easier to hold than loose floss, so they may help children, older adults and people with limited dexterity or braces. A floss threader helps pass floss under bridges and wires.','<b>Choosing:</b> the best floss is the one you can use comfortably every day. Ask your dental team which suits your teeth, braces, bridge or implants.'],27:['<b>Interdental brushes</b> are small brushes that clean between the teeth. They are often easier than floss when the gap is large enough, and suit people with gum disease or receding gums.','<b>Sizes:</b> choose the largest size that slides in gently without force. Different gaps may need different sizes. Ask your dental team to measure them.','<b>How to use:</b> angle the brush slightly towards the gum, insert it gently into the gap and move it in and out a few times. Do not force it.','<b>Braces, bridges and implants:</b> interdental brushes clean around brackets and wires, under bridges and beside implants. Use floss where the gaps are too tight for a brush.','<b>Water flossers (oral irrigators)</b> use a jet of water. They can help people with braces, bridges, implants or limited dexterity as an extra aid, but they do not replace brushing.','<b>Single-tufted toothbrush:</b> a small brush with one tuft of bristles, for hard-to-reach places such as behind the last tooth, crowded teeth, braces and implants.'],28:['<b>Mouthwash is an extra, not a replacement.</b> It does not replace toothbrushing and cleaning between your teeth.','<b>Fluoride mouthwash</b> helps protect against tooth decay. Use it at a different time from brushing, for example after lunch, so that it does not wash away the fluoride from your toothpaste.','<b>Antiseptic mouthwash</b> (for example with cetylpyridinium chloride or essential oils) can help reduce plaque and freshen breath as an extra step. Follow the label.','<b>Chlorhexidine mouthwash</b> is not for routine daily use. A dentist or doctor prescribes it for a short, defined period, for example after some procedures or for certain gum conditions. Long-term use can stain the teeth and tongue and change taste.','<b>Alcohol-free mouthwash</b> is gentler and suits people with a dry or sensitive mouth. Alcohol-containing mouthwash can sting and dry the mouth.','<b>How to use:</b> measure the amount on the label, swish for the time stated, then spit it out. Do not swallow it, do not rinse with water straight afterwards, and do not use it straight after brushing. Ask your dentist before giving it to young children.','!Fluoride mouthwash strength and the age from which children may use it: pending verification against current MOH Malaysia guidance.'],29:['<b>Tongue scrapers and cleaners:</b> a coating of bacteria and food debris on the tongue is a common cause of bad breath. Clean the tongue once a day, gently, from the back towards the front, with a scraper or a soft toothbrush.','<b>Denture brushes</b> have firm bristles shaped for the curves of dentures. Use them with soap or denture cleaner, not ordinary toothpaste, which can scratch.','<b>Orthodontic toothbrushes</b> have a V-shaped or grooved bristle pattern to clean around brackets and wires.','<b>Bridges and retainers:</b> clean under bridges with super floss, floss threaders or interdental brushes. Clean removable retainers with a soft brush and cool water, as your dentist advises.','If bad breath continues despite good cleaning, see your dentist.'],30:['<b>Morning:</b> brush for about two minutes with fluoride toothpaste and clean your tongue. Clean between your teeth if advised.','<b>Night-time (the most important):</b> clean between your teeth, then brush for about two minutes with fluoride toothpaste and spit out. Do not eat or drink anything except water afterwards.','<b>Sequence:</b> clean between the teeth, brush all surfaces, clean the tongue, spit out the toothpaste without rinsing. Use mouthwash at a different time if advised.','<b>After meals:</b> rinse with water. After acidic foods or drinks, wait for some time before brushing. <b>After vomiting or reflux:</b> rinse with plain water and wait before brushing, because stomach acid softens the enamel.','<b>Common mistakes:</b> brushing too hard or for too short a time, not cleaning between the teeth, rinsing straight after brushing, using a worn toothbrush and skipping night-time cleaning.'],31:['<b>Every person is different.</b> Choose aids for the person’s needs with advice from the dental team, and with caregiver help where needed.','<b>Enlarged handle and foam grip:</b> a thicker handle, or soft foam tubing slid over the handle, is easier to hold for a weak grip or arthritis.','<b>Angled handle:</b> a bent handle helps people who cannot turn the wrist or reach the back teeth. Ask the dental team how to adapt a handle safely.','<b>Hand strap:</b> a strap holds the brush in the hand for people who cannot grip, for example after a stroke.','<b>Powered toothbrush, floss holders and water flossers:</b> these can help people with limited dexterity. Some people may not tolerate the vibration or noise.','<b>Cerebral palsy and limited hand coordination:</b> a stable, comfortable position, a thicker handle and a powered brush may help. A caregiver may need to guide or complete the brushing.','<b>Parkinson’s disease and stroke:</b> a thick handle or hand strap helps a weak or shaky grip. Keep sessions short, rest the arm on a table and check for food trapped on the weaker side.','<b>Intellectual disabilities:</b> use a calm, fixed routine with simple steps, pictures or a demonstration, and praise. Caregiver help is often needed.','<b>Physical disabilities and limited mouth opening:</b> adapt the handle, choose a small-headed or single-tufted brush and ask the dental team about positioning.','<b>Seek professional help</b> if there is difficulty swallowing, choking while brushing, mouth pain or sores, or if the mouth cannot be cleaned.']},
w:{28:['Brushing and cleaning between the teeth remove plaque. Mouthwash only adds to this.','Rinsing straight after brushing can wash away the fluoride left on your teeth.','Chlorhexidine is strong and needs professional guidance.']},
C:{oku:['Standard','Enlarged handle','Foam grip','Angled handle','Hand strap','Powered brush'],oc:'Illustration of common toothbrush adaptations. The right choice depends on the person.',fl:['Floss','Dental tape','Super floss','Floss pick','Floss holder','Floss threader'],fc:'Illustration of common types of floss and flossing aids.',sz:['Small','Large'],ibn:'Illustration of interdental brush sizes. Sizes and colours vary by brand, so ask your dental team to measure the right size.',dm:'Animated illustration'}},
ms:{n:['Teknik Memberus Gigi','Flos Gigi: Jenis dan Pilihan','Pembersihan Celah Gigi','Ubat Kumur','Pembersihan Lidah dan Alat Bantuan Lain','Rutin Kebersihan Mulut Harian','Berus Gigi dan Alat Bantuan Penyesuaian (Keperluan Khas/OKU)'],r1:'Berus Gigi: Pemilihan dan Penggunaan',r3:'Cara Mengflos',sb:'<b>Lihat juga:</b>',
m1:['<b>Manual atau elektrik?</b> Kedua-duanya membersihkan dengan baik jika digunakan dengan betul. Berus gigi berkuasa boleh membantu orang yang mempunyai ketangkasan terhad dan kanak-kanak yang perlu galakan.','<b>Bulu berus:</b> bulu lembut, sederhana dan keras dijual. Bulu lembut disyorkan kerana membuang plak dengan baik dan lebih lembut pada gusi dan gigi. Bulu sederhana dan keras mungkin merosakkan gusi dan menghakis permukaan gigi, terutamanya jika anda memberus dengan kuat.','<b>Reka bentuk kepala:</b> pilih kepala yang kecil hingga sederhana dan dapat mencapai gigi belakang. Kepala berbentuk tirus, bersudut atau V boleh membantu dalam keadaan tertentu, tetapi teknik yang betul lebih penting daripada reka bentuk.'],
m2:['<b>Baca label:</b> cari fluorida dan kandungannya dalam ppm. Kebanyakan ubat gigi harian mengandungi fluorida.','<b>Gigi sensitif:</b> ubat gigi untuk gigi sensitif boleh membantu jika digunakan secara tetap. Tanya pasukan pergigian anda jika sakit tidak reda.','<b>Ubat gigi pemutih:</b> ia boleh membuang kotoran pada permukaan tetapi tidak mengubah warna semula jadi gigi, dan sesetengahnya bersifat melelas atau menyebabkan kepekaan. Pilih yang mengandungi fluorida.','<b>Ubat gigi berfluorida tinggi:</b> ubat gigi berfluorida yang lebih kuat mungkin dipreskripsikan kepada orang yang berisiko tinggi mendapat karies. Gunakan hanya atas nasihat doktor pergigian.','<b>Keadaan khas:</b> orang yang mengalami mulut kering, masalah gusi atau keadaan lain mungkin memerlukan ubat gigi tertentu. Tanya doktor pergigian anda.'],
m:{25:[],26:['<b>Mengapa perlu mengflos?</b> Berus gigi tidak dapat sampai ke sisi gigi yang bersentuhan. Membersihkan celah gigi sekali sehari membuang plak di kawasan ini.','<b>Flos berlilin</b> meluncur dengan mudah di celah gigi yang rapat dan kurang mudah terkoyak. <b>Flos tanpa lilin</b> lebih nipis dan sesuai untuk ruang yang lebih lebar, tetapi boleh terburai.','<b>Pita gigi</b> ialah reben yang leper dan lebih lebar. Ia sesuai untuk celah yang lebih lebar dan gusi sensitif.','<b>Flos super</b> mempunyai hujung keras untuk disisipkan, bahagian span dan flos biasa. Ia berguna untuk pendakap, jambatan gigi dan sekeliling implan.','<b>Pemetik flos dan pemegang flos</b> lebih mudah dipegang berbanding flos yang longgar, jadi ia boleh membantu kanak-kanak, warga emas dan orang yang mempunyai ketangkasan terhad atau pendakap. Penyulam flos membantu memasukkan flos di bawah jambatan gigi dan wayar.','<b>Pemilihan:</b> flos yang terbaik ialah flos yang boleh anda gunakan dengan selesa setiap hari. Tanya pasukan pergigian anda yang sesuai untuk gigi, pendakap, jambatan gigi atau implan anda.'],27:['<b>Berus interdental</b> ialah berus kecil yang membersihkan celah gigi. Ia selalunya lebih mudah daripada flos jika celahnya cukup besar, dan sesuai untuk orang yang mempunyai penyakit gusi atau gusi surut.','<b>Saiz:</b> pilih saiz terbesar yang boleh masuk dengan lembut tanpa dipaksa. Celah yang berbeza mungkin memerlukan saiz yang berbeza. Minta pasukan pergigian anda mengukurnya.','<b>Cara menggunakan:</b> condongkan berus sedikit ke arah gusi, masukkan dengan lembut ke dalam celah dan gerakkan keluar masuk beberapa kali. Jangan dipaksa.','<b>Pendakap, jambatan gigi dan implan:</b> berus interdental membersihkan sekeliling braket dan wayar, di bawah jambatan gigi dan di sebelah implan. Gunakan flos jika celahnya terlalu rapat untuk berus.','<b>Pengairan oral (water flosser)</b> menggunakan pancutan air. Ia boleh membantu orang yang memakai pendakap, jambatan gigi, implan atau mempunyai ketangkasan terhad sebagai alat tambahan, tetapi tidak menggantikan memberus.','<b>Berus gigi berumbai tunggal:</b> berus kecil dengan satu umbai bulu, untuk tempat yang sukar dicapai seperti di belakang gigi terakhir, gigi bersesak, pendakap dan implan.'],28:['<b>Ubat kumur ialah tambahan, bukan pengganti.</b> Ia tidak menggantikan memberus gigi dan membersihkan celah gigi.','<b>Ubat kumur berfluorida</b> membantu melindungi daripada karies gigi. Gunakannya pada waktu yang berbeza daripada memberus, contohnya selepas makan tengah hari, supaya ia tidak membasuh fluorida daripada ubat gigi anda.','<b>Ubat kumur antiseptik</b> (contohnya yang mengandungi cetylpyridinium chloride atau minyak pati) boleh membantu mengurangkan plak dan menyegarkan nafas sebagai langkah tambahan. Ikut arahan pada label.','<b>Ubat kumur klorheksidina</b> bukan untuk kegunaan harian secara rutin. Doktor pergigian atau doktor mempreskripsikannya untuk tempoh yang singkat dan ditetapkan, contohnya selepas sesetengah prosedur atau bagi keadaan gusi tertentu. Penggunaan jangka panjang boleh menyebabkan gigi dan lidah bernoda serta mengubah rasa.','<b>Ubat kumur tanpa alkohol</b> lebih lembut dan sesuai untuk orang yang mempunyai mulut kering atau sensitif. Ubat kumur beralkohol boleh menyengat dan mengeringkan mulut.','<b>Cara menggunakan:</b> sukat jumlah pada label, kumur selama masa yang dinyatakan, kemudian ludahkan. Jangan telan, jangan berkumur dengan air serta-merta selepas itu, dan jangan gunakan sebaik sahaja selepas memberus. Tanya doktor pergigian sebelum memberikannya kepada kanak-kanak kecil.','!Kepekatan ubat kumur berfluorida dan umur kanak-kanak yang boleh menggunakannya: menunggu pengesahan berdasarkan garis panduan KKM Malaysia semasa.'],29:['<b>Pengikis lidah dan pembersih lidah:</b> salutan bakteria dan sisa makanan pada lidah ialah punca biasa nafas berbau. Bersihkan lidah sekali sehari dengan lembut, dari belakang ke depan, menggunakan pengikis lidah atau berus gigi yang lembut.','<b>Berus gigi palsu</b> mempunyai bulu yang lebih keras dan berbentuk sesuai dengan lekuk gigi palsu. Gunakannya dengan sabun atau pembersih gigi palsu, bukan ubat gigi biasa yang boleh menggaruinya.','<b>Berus gigi ortodontik</b> mempunyai susunan bulu berbentuk V atau beralur untuk membersihkan sekeliling braket dan wayar.','<b>Jambatan gigi dan alat penahan:</b> bersihkan di bawah jambatan gigi dengan flos super, penyulam flos atau berus interdental. Bersihkan alat penahan yang boleh ditanggalkan dengan berus lembut dan air sejuk, seperti dinasihatkan oleh doktor pergigian anda.','Jika nafas berbau berterusan walaupun pembersihan telah baik, berjumpa doktor pergigian.'],30:['<b>Pagi:</b> berus gigi selama kira-kira dua minit dengan ubat gigi berfluorida dan bersihkan lidah. Bersihkan celah gigi jika dinasihatkan.','<b>Malam (yang paling penting):</b> bersihkan celah gigi, kemudian berus gigi selama kira-kira dua minit dengan ubat gigi berfluorida dan ludahkan. Jangan makan atau minum apa-apa selain air selepas itu.','<b>Urutan:</b> bersihkan celah gigi, berus semua permukaan, bersihkan lidah, ludahkan ubat gigi tanpa berkumur. Gunakan ubat kumur pada waktu yang berbeza jika dinasihatkan.','<b>Selepas makan:</b> kumur dengan air. Selepas makanan atau minuman berasid, tunggu seketika sebelum memberus. <b>Selepas muntah atau refluks:</b> kumur dengan air kosong dan tunggu sebelum memberus, kerana asid perut melembutkan enamel.','<b>Kesilapan biasa:</b> memberus terlalu kuat atau terlalu singkat, tidak membersihkan celah gigi, berkumur serta-merta selepas memberus, menggunakan berus gigi yang sudah haus dan tidak membersihkan gigi pada waktu malam.'],31:['<b>Setiap orang berbeza.</b> Pilih alat bantuan mengikut keperluan individu dengan nasihat pasukan pergigian, dan dengan bantuan penjaga jika perlu.','<b>Pemegang besar dan pemegang span:</b> pemegang yang lebih tebal, atau tiub span lembut yang disarungkan pada pemegang, lebih mudah dipegang oleh orang yang genggamannya lemah atau menghidap artritis.','<b>Pemegang bersudut:</b> pemegang yang bengkok membantu orang yang tidak dapat memutar pergelangan tangan atau mencapai gigi belakang. Tanya pasukan pergigian cara menyesuaikan pemegang dengan selamat.','<b>Tali tangan:</b> tali memegang berus pada tangan bagi orang yang tidak dapat menggenggam, contohnya selepas strok.','<b>Berus gigi berkuasa, pemegang flos dan pengairan oral:</b> ini boleh membantu orang yang mempunyai ketangkasan terhad. Sesetengah orang mungkin tidak tahan getaran atau bunyinya.','<b>Lumpuh otak (cerebral palsy) dan koordinasi tangan yang terhad:</b> kedudukan yang stabil dan selesa, pemegang yang lebih tebal dan berus gigi berkuasa mungkin membantu. Penjaga mungkin perlu membimbing atau menyempurnakan pemberusan.','<b>Penyakit Parkinson dan strok:</b> pemegang tebal atau tali tangan membantu genggaman yang lemah atau menggeletar. Pendekkan sesi, sandarkan lengan pada meja dan periksa sisa makanan yang tersekat di bahagian yang lebih lemah.','<b>Ketidakupayaan intelektual:</b> gunakan rutin yang tenang dan tetap dengan langkah mudah, gambar atau demonstrasi, dan pujian. Bantuan penjaga selalunya diperlukan.','<b>Ketidakupayaan fizikal dan bukaan mulut yang terhad:</b> sesuaikan pemegang, pilih berus berkepala kecil atau berumbai tunggal dan minta nasihat pasukan pergigian tentang kedudukan.','<b>Dapatkan bantuan profesional</b> jika sukar menelan, tercekik semasa memberus, sakit atau luka pada mulut, atau mulut tidak dapat dibersihkan.']},
w:{28:['Memberus dan membersihkan celah gigi membuang plak. Ubat kumur hanya menambah kesannya.','Berkumur serta-merta selepas memberus boleh membasuh fluorida yang tinggal pada gigi anda.','Klorheksidina adalah kuat dan memerlukan panduan profesional.']},
C:{oku:['Biasa','Pemegang besar','Pemegang span','Pemegang bersudut','Tali tangan','Berus berkuasa'],oc:'Ilustrasi penyesuaian berus gigi yang biasa. Pilihan yang sesuai bergantung pada individu.',fl:['Flos','Pita gigi','Flos super','Pemetik flos','Pemegang flos','Penyulam flos'],fc:'Ilustrasi jenis flos dan alat bantuan mengflos yang biasa.',sz:['Kecil','Besar'],ibn:'Ilustrasi saiz berus interdental. Saiz dan warna berbeza mengikut jenama, jadi minta pasukan pergigian anda mengukur saiz yang sesuai.',dm:'Ilustrasi animasi'}},
zh:{n:['刷牙技巧','牙线：种类与选择','牙缝清洁','漱口水','舌头清洁及其他辅助用具','每日口腔清洁流程','适应性牙刷与辅助用具（特殊需要/OKU）'],r1:'牙刷：选择与使用',r3:'如何使用牙线',sb:'<b>另请参阅：</b>',
m1:['<b>手动还是电动？</b>只要使用正确，两者都能清洁得很好。电动牙刷可帮助灵活性较差的人以及需要鼓励的儿童。','<b>刷毛：</b>市面上有软毛、中毛和硬毛。推荐软毛，因为它能有效清除牙菌斑，而且对牙龈和牙齿更温和。中毛和硬毛可能伤害牙龈并磨损牙齿表面，尤其是用力刷牙时。','<b>刷头设计：</b>选择能刷到后牙的小到中等大小的刷头。锥形、弯角或V形刷头在某些情况下有帮助，但良好的技巧比设计更重要。'],
m2:['<b>查看标签：</b>找出是否含氟以及含氟量（ppm）。大多数日常牙膏都含氟。','<b>敏感牙齿：</b>抗敏感牙膏若规律使用可能有帮助。若疼痛不缓解，请咨询牙科团队。','<b>美白牙膏：</b>可去除表面污渍，但不会改变牙齿的天然颜色，有些产品摩擦性较强或会引起敏感。请选择含氟的产品。','<b>高氟牙膏：</b>龋齿高风险人群可能被开具含氟量更高的牙膏。请仅在牙医建议下使用。','<b>特殊情况：</b>口干、牙龈问题或其他情况的人可能需要特定的牙膏。请咨询牙医。'],
m:{25:[],26:['<b>为什么要用牙线？</b>牙刷刷不到牙齿相接的侧面。每天清洁一次牙缝，可清除这些部位的牙菌斑。','<b>有蜡牙线</b>容易滑入紧密的牙缝，不容易磨损。<b>无蜡牙线</b>更细，适合较宽的空隙，但容易起毛。','<b>牙线带（扁平牙线）</b>是扁平、较宽的带状牙线，适合较宽的牙缝和敏感的牙龈。','<b>超级牙线</b>有硬质穿线头、海绵状部分和普通牙线。适用于戴牙套、牙桥和种植牙周围。','<b>牙线棒和牙线柄</b>比散装牙线更容易握持，可帮助儿童、老年人以及灵活性较差或戴牙套的人。穿线器帮助把牙线穿过牙桥和矫正钢丝下方。','<b>如何选择：</b>最好的牙线就是您每天都能舒适使用的那一种。请咨询牙科团队哪种适合您的牙齿、牙套、牙桥或种植牙。'],27:['<b>牙缝刷</b>是清洁牙缝的小刷子。当缝隙足够大时，它往往比牙线更容易使用，适合患有牙龈疾病或牙龈退缩的人。','<b>尺寸：</b>选择能轻轻伸入、不需用力的最大尺寸。不同的缝隙可能需要不同的尺寸。请牙科团队帮您测量。','<b>使用方法：</b>让刷子稍微朝向牙龈，轻轻伸入缝隙，来回抽动几次。不要用力硬塞。','<b>牙套、牙桥和种植牙：</b>牙缝刷可清洁托槽和钢丝周围、牙桥下方和种植牙旁边。若缝隙太紧、刷子放不进去，就用牙线。','<b>冲牙器（水牙线）</b>利用水柱冲洗。对戴牙套、有牙桥、种植牙或灵活性较差的人，可作为额外辅助，但不能取代刷牙。','<b>单束牙刷：</b>只有一束刷毛的小牙刷，用于难以刷到的地方，如最后一颗牙的后面、拥挤的牙齿、牙套和种植牙周围。'],28:['<b>漱口水是额外的辅助，不是替代品。</b>它不能取代刷牙和清洁牙缝。','<b>含氟漱口水</b>有助于预防蛀牙。请在与刷牙不同的时间使用，例如午餐后，以免冲掉牙膏中的氟。','<b>抑菌漱口水</b>（例如含氯化十六烷基吡啶或精油的产品）可作为额外步骤帮助减少牙菌斑和使口气清新。请按标签使用。','<b>氯己定（洗必泰）漱口水</b>不适合日常常规使用。由牙医或医生开具，只在短期、明确的时间内使用，例如某些治疗后或针对某些牙龈问题。长期使用可能使牙齿和舌头染色，并改变味觉。','<b>无酒精漱口水</b>更温和，适合口干或口腔敏感的人。含酒精的漱口水可能有刺痛感，并使口腔干燥。','<b>使用方法：</b>按标签量取用量，按标示时间含漱，然后吐出。不要吞咽，不要随后立刻用清水漱口，也不要在刷牙后立刻使用。给幼儿使用前请先咨询牙医。','!含氟漱口水的浓度及儿童可使用的年龄：有待对照马来西亚卫生部最新指南核实。'],29:['<b>刮舌器和舌头清洁器：</b>舌头上的细菌和食物残渣苔是口臭的常见原因。每天用刮舌器或软毛牙刷，从舌头后部向前轻轻清洁一次。','<b>假牙刷</b>毛较硬，形状适合假牙的曲面。请搭配肥皂或假牙清洁剂使用，不要用普通牙膏，它会刮伤假牙。','<b>正畸专用牙刷</b>的刷毛呈V形或凹槽形，可清洁托槽和钢丝周围。','<b>牙桥和保持器：</b>用超级牙线、穿线器或牙缝刷清洁牙桥下方。可摘戴的保持器用软毛刷和冷水清洁，并按牙医的建议。','如果清洁得很好口臭仍然持续，请看牙医。'],30:['<b>早上：</b>用含氟牙膏刷牙约两分钟，并清洁舌头。如有建议，还要清洁牙缝。','<b>晚上（最重要）：</b>先清洁牙缝，再用含氟牙膏刷牙约两分钟，然后吐出泡沫。之后除了清水，不要再吃东西或喝饮料。','<b>顺序：</b>清洁牙缝、刷所有牙面、清洁舌头、吐出牙膏而不漱口。如有建议，请在不同时间使用漱口水。','<b>餐后：</b>用清水漱口。吃了酸性食物或喝了酸性饮料后，等一段时间再刷牙。<b>呕吐或胃酸反流后：</b>用清水漱口，等一会儿再刷牙，因为胃酸会使牙釉质变软。','<b>常见错误：</b>刷牙太用力或时间太短、不清洁牙缝、刷牙后立刻漱口、使用磨损的牙刷，以及晚上不清洁牙齿。'],31:['<b>每个人都不同。</b>请根据个人需要，在牙科团队的建议下选择辅助用具，必要时由照护者协助。','<b>加粗刷柄和泡棉握把：</b>更粗的刷柄，或套在刷柄上的软泡棉管，对握力较弱或患关节炎的人更容易握住。','<b>弯角刷柄：</b>弯曲的刷柄可帮助手腕无法转动或够不到后牙的人。请向牙科团队咨询如何安全地改装刷柄。','<b>手带（固定带）：</b>带子把牙刷固定在手上，适用于无法抓握的人，例如中风后。','<b>电动牙刷、牙线柄和冲牙器：</b>这些可帮助灵活性较差的人。有些人可能不适应振动或噪音。','<b>脑性麻痹和手部协调性较差：</b>稳定舒适的姿势、较粗的刷柄和电动牙刷可能有帮助。照护者可能需要引导或帮忙完成刷牙。','<b>帕金森病和中风：</b>粗刷柄或手带可帮助握力较弱或手抖。缩短刷牙时间，把手臂靠在桌上，并检查较弱一侧是否夹留食物。','<b>智力障碍：</b>采用平静、固定的流程，用简单步骤、图片或示范来配合，并给予称赞。通常需要照护者的协助。','<b>肢体残障和张口受限：</b>改装刷柄，选择小头或单束牙刷，并向牙科团队咨询姿势。','<b>请寻求专业帮助：</b>若有吞咽困难、刷牙时呛噎、口腔疼痛或溃疡，或无法清洁口腔。']},
w:{28:['刷牙和清洁牙缝能清除牙菌斑，漱口水只是额外的补充。','刷牙后立刻漱口，会冲掉留在牙齿上的氟。','氯己定药效强，需要专业指导。']},

cat:['Understanding Your Mouth','Dental Diseases and Conditions','Cancer, Risk Habits and Awareness','Prevention and Healthy Habits','General Health and Emergencies'],an:['Enamel','Dentine','Pulp (nerve)','Gum','Bone','Illustration of a tooth and its supporting tissues.'],
m:{32:['<b>Parts of a tooth:</b> the crown is the part you can see and the root is anchored in the jawbone. Enamel is the hard outer layer of the crown, dentine lies beneath it, and the pulp in the centre holds nerves and blood vessels.','<b>Supporting tissues:</b> the gum surrounds the tooth, and the periodontal ligament and bone hold it in place.','<b>Your teeth:</b> adults usually have up to 32 permanent teeth: incisors, canines, premolars and molars. Children have 20 primary (baby) teeth.','<b>Enamel cannot regrow</b> once it is lost, but early damage can be strengthened with fluoride.','<b>Saliva</b> protects the teeth by washing away food, neutralising acid and supplying minerals.'],
33:['<b>What are they?</b> Oral potentially malignant disorders (OPMD) are changes in the lining of the mouth, such as white or red patches, that can sometimes turn into cancer. Most do not.','<b>Examples:</b> leukoplakia (white patch), erythroplakia (red patch) and oral submucous fibrosis (stiffening of the cheeks, often linked to chewing betel quid or areca nut).','<b>Warning signs:</b> white or red patches that cannot be wiped off, a burning feeling with spicy food, a mouth that is hard to open wide, or an ulcer that does not heal.','<b>Risk factors:</b> tobacco, betel quid, areca nut and alcohol. Stopping these habits lowers the risk.','<b>What to do:</b> do not diagnose yourself. See your dentist about any patch or change that lasts for more than two weeks. Your dentist may monitor it or take a small sample (biopsy).'],
34:['<b>What fluoride does:</b> fluoride strengthens enamel and helps early decay to repair. It is one of the most effective ways to prevent tooth decay.','<b>Where it comes from:</b> fluoride toothpaste, fluoride mouthwash, professional fluoride varnish and, in some places, fluoridated drinking water.','<b>Professional fluoride:</b> your dental team may apply fluoride varnish, especially for children and people at higher risk of decay.','<b>Using it safely:</b> use the right amount of toothpaste for the age, spit it out, and keep toothpaste out of reach of young children. Swallowing too much while teeth are forming can cause white or brown marks (dental fluorosis).','!Fluoride amounts and concentrations by age: pending verification against current MOH Malaysia guidance.'],
35:['<b>Alcohol and oral cancer:</b> drinking alcohol raises the risk of oral cancer, and the risk is higher when it is combined with tobacco.','<b>Other effects:</b> alcohol can dry the mouth and irritate the gums, and sweetened alcoholic drinks and mixers can contribute to tooth decay.','<b>Acid:</b> some alcoholic drinks are acidic and can wear away tooth enamel.','<b>Reducing the risk:</b> limit or avoid alcohol, drink water too, and do not brush straight after acidic drinks.','<b>When to seek professional help:</b> ulcers that do not heal, white or red patches, or ongoing mouth pain. Ask your clinic about support to cut down.'],
36:['<b>What is erosion?</b> Tooth erosion is the loss of enamel caused by acid that does not come from bacteria, such as acidic food and drinks or stomach acid.','<b>Causes:</b> fizzy and energy drinks, sports drinks, fruit juices, citrus fruits, and repeated vomiting or acid reflux.','<b>Signs:</b> sensitive teeth, teeth that look smooth, shiny or yellow, and worn or rounded edges.','<b>Prevention:</b> limit acidic drinks, have them with meals or through a straw, rinse with water afterwards and wait before brushing. Use fluoride toothpaste.','<b>See your dentist</b> if you have reflux, repeated vomiting, or teeth that are becoming sensitive or worn.'],
37:['<b>What is it?</b> Halitosis is persistent bad breath. It is common and often treatable.','<b>Causes:</b> most cases come from bacteria on the tongue and between the teeth and gums. Other causes include gum disease, tooth decay, dry mouth, smoking, dentures that are not cleaned, and some medical conditions.','<b>What helps:</b> brush twice a day, clean between the teeth, clean the tongue, clean dentures every day, drink water and avoid smoking.','<b>Mouthwash</b> only freshens the breath for a short time and does not treat the cause.','<b>See your dentist</b> if bad breath continues despite good cleaning. Your dentist can check for gum disease, decay or other causes and may advise you to see a doctor.'],
38:['<b>Primary teeth</b> usually start to appear at around six months of age, and most children have a full set of 20 by about three years.','<b>Permanent teeth</b> start to come in at about six years of age, beginning with the first molars and the lower front teeth. Primary teeth are lost gradually until about twelve years.','<b>Wisdom teeth</b> usually appear between about 17 and 25 years of age. Some do not come through fully and may need review by a dentist.','<b>Teething</b> can cause drooling, sore gums and irritability. A clean teething ring may help. Ask your dentist or doctor before using any medicine or gel.','<b>Timing varies.</b> If teeth come much earlier or later than expected, ask your dentist.'],
39:['<b>If a permanent tooth is knocked out:</b> pick it up by the crown, not the root, and do not scrub it. If it is dirty, rinse it gently with milk or clean water and try to place it back in its socket. If you cannot, keep it in milk and see a dentist urgently. Do not put a baby tooth back.','<b>Broken or chipped tooth:</b> rinse the mouth, keep any fragment in milk and see a dentist soon.','<b>Toothache:</b> rinse with warm water, clean gently between the teeth and see a dentist. Do not put aspirin or other medicine on the gum.','<b>Facial swelling, fever, or difficulty swallowing or breathing</b> need urgent medical attention. Go to the nearest hospital or clinic.','<b>Prevention:</b> wear a mouthguard for contact sports, wear a seat belt and avoid biting very hard objects.'],
40:['<b>Why go regularly?</b> Many problems, such as early decay, gum disease and oral cancer, cause no pain at first. A check-up finds them early.','<b>What happens:</b> your dentist examines your teeth, gums, tongue and the lining of your mouth, may take X-rays when needed, and gives advice on home care.','<b>How often:</b> it depends on your risk of dental disease. Ask your dentist how often you should come.','<b>Bring</b> a list of your medicines and health conditions, and tell your dentist about any changes in your mouth.','<b>Children:</b> take them for a first visit when the first teeth appear, and keep going for regular visits.','<b>Do not wait for pain:</b> see your dentist sooner if you have pain, bleeding gums, swelling, a mouth ulcer that does not heal or loose teeth.'],
41:['<b>Myth:</b> baby teeth do not matter because they fall out. <b>Fact:</b> baby teeth help with eating and speaking and guide adult teeth into place. Decay can cause pain and infection.','<b>Myth:</b> brushing harder cleans better. <b>Fact:</b> brushing hard can damage the gums and enamel. Gentle, thorough brushing works best.','<b>Myth:</b> bleeding gums mean you should stop brushing. <b>Fact:</b> bleeding usually means plaque and inflamed gums. Keep cleaning gently and see your dentist if it continues.','<b>Myth:</b> only sugar causes cavities. <b>Fact:</b> bacteria turn sugars and other fermentable carbohydrates into acid. How often you eat sweet foods matters, and so do plaque removal and fluoride.','<b>Myth:</b> mouthwash can replace brushing. <b>Fact:</b> it cannot. Mouthwash is only an extra.','<b>Myth:</b> vaping is safe for the mouth. <b>Fact:</b> vaping is not risk-free. It can dry the mouth and irritate the gums, and it may contain nicotine.','<b>Myth:</b> if it does not hurt, my teeth are fine. <b>Fact:</b> early decay and gum disease often cause no pain, so regular check-ups are important.']}},
ms:{n:['Anatomi Mulut dan Struktur Gigi','Gangguan Mulut Berpotensi Malignan (OPMD)','Kesedaran tentang Fluorida','Alkohol dan Kesihatan Mulut','Hakisan Gigi (Erosi)','Halitosis (Nafas Berbau)','Pertumbuhan dan Perkembangan Gigi','Trauma Pergigian dan Kecemasan','Pemeriksaan Pergigian Berkala','Mitos dan Fakta Pergigian'],sb:'<b>Lihat juga:</b>',
cat:['Memahami Mulut Anda','Penyakit dan Keadaan Pergigian','Kanser, Tabiat Berisiko dan Kesedaran','Pencegahan dan Tabiat Sihat','Kesihatan Am dan Kecemasan'],an:['Enamel','Dentin','Pulpa (saraf)','Gusi','Tulang','Ilustrasi gigi dan tisu penyokongnya.'],
m:{32:['<b>Bahagian gigi:</b> mahkota ialah bahagian yang boleh dilihat dan akar tertanam dalam tulang rahang. Enamel ialah lapisan luar mahkota yang keras, dentin terletak di bawahnya, dan pulpa di tengah mengandungi saraf serta saluran darah.','<b>Tisu penyokong:</b> gusi mengelilingi gigi, dan ligamen periodontal serta tulang memegang gigi pada tempatnya.','<b>Gigi anda:</b> orang dewasa biasanya mempunyai sehingga 32 batang gigi kekal: gigi kacip, gigi taring, geraham kecil dan geraham. Kanak-kanak mempunyai 20 batang gigi susu.','<b>Enamel tidak dapat tumbuh semula</b> apabila hilang, tetapi kerosakan awal boleh dikuatkan dengan fluorida.','<b>Air liur</b> melindungi gigi dengan membasuh sisa makanan, meneutralkan asid dan membekalkan mineral.'],
33:['<b>Apakah itu?</b> Gangguan mulut berpotensi malignan (OPMD) ialah perubahan pada lapisan mulut, seperti tompok putih atau merah, yang kadangkala boleh bertukar menjadi kanser. Kebanyakannya tidak.','<b>Contoh:</b> leukoplakia (tompok putih), eritroplakia (tompok merah) dan fibrosis submukosa mulut (pengerasan pipi, selalunya berkaitan dengan mengunyah sirih atau pinang).','<b>Tanda amaran:</b> tompok putih atau merah yang tidak boleh dilap, rasa pedih apabila makan makanan pedas, mulut yang sukar dibuka luas, atau ulser yang tidak sembuh.','<b>Faktor risiko:</b> tembakau, sirih, pinang dan alkohol. Berhenti daripada tabiat ini mengurangkan risiko.','<b>Apa yang perlu dilakukan:</b> jangan mendiagnosis sendiri. Berjumpa doktor pergigian jika sebarang tompok atau perubahan berterusan melebihi dua minggu. Doktor pergigian mungkin memantaunya atau mengambil sampel kecil (biopsi).'],
34:['<b>Fungsi fluorida:</b> fluorida menguatkan enamel dan membantu karies awal pulih. Ia salah satu cara paling berkesan untuk mencegah karies gigi.','<b>Sumbernya:</b> ubat gigi berfluorida, ubat kumur berfluorida, varnis fluorida profesional dan, di sesetengah tempat, air minuman berfluorida.','<b>Fluorida profesional:</b> pasukan pergigian mungkin menyapu varnis fluorida, terutamanya untuk kanak-kanak dan orang yang berisiko lebih tinggi mendapat karies.','<b>Penggunaan yang selamat:</b> gunakan jumlah ubat gigi yang sesuai dengan umur, ludahkan, dan jauhkan ubat gigi daripada capaian kanak-kanak kecil. Menelan terlalu banyak semasa gigi sedang terbentuk boleh menyebabkan tompok putih atau coklat (fluorosis gigi).','!Jumlah dan kepekatan fluorida mengikut umur: menunggu pengesahan berdasarkan garis panduan KKM Malaysia semasa.'],
35:['<b>Alkohol dan kanser mulut:</b> minum alkohol meningkatkan risiko kanser mulut, dan risikonya lebih tinggi jika digabungkan dengan tembakau.','<b>Kesan lain:</b> alkohol boleh mengeringkan mulut dan merengsa gusi, dan minuman beralkohol yang bermanis serta pencampurnya boleh menyumbang kepada karies gigi.','<b>Asid:</b> sesetengah minuman beralkohol bersifat asid dan boleh menghakis enamel gigi.','<b>Mengurangkan risiko:</b> hadkan atau elakkan alkohol, minum air juga, dan jangan memberus gigi sebaik sahaja selepas minuman berasid.','<b>Bilakah perlu mendapatkan bantuan profesional:</b> ulser yang tidak sembuh, tompok putih atau merah, atau sakit mulut yang berterusan. Tanya klinik anda tentang sokongan untuk mengurangkannya.'],
36:['<b>Apakah hakisan gigi?</b> Hakisan gigi (erosi) ialah kehilangan enamel akibat asid yang bukan datang daripada bakteria, seperti makanan dan minuman berasid atau asid perut.','<b>Punca:</b> minuman berkarbonat dan bertenaga, minuman sukan, jus buah, buah sitrus, serta muntah berulang atau refluks asid.','<b>Tanda:</b> gigi sensitif, gigi yang kelihatan licin, berkilat atau kekuningan, dan tepi gigi yang haus atau bulat.','<b>Pencegahan:</b> hadkan minuman berasid, minum bersama hidangan atau menggunakan penyedut minuman, kumur dengan air selepas itu dan tunggu sebelum memberus. Gunakan ubat gigi berfluorida.','<b>Berjumpa doktor pergigian</b> jika anda mengalami refluks, muntah berulang, atau gigi yang menjadi sensitif atau haus.'],
37:['<b>Apakah itu?</b> Halitosis ialah nafas berbau yang berterusan. Ia biasa berlaku dan selalunya boleh dirawat.','<b>Punca:</b> kebanyakan kes berpunca daripada bakteria pada lidah serta di celah gigi dan gusi. Punca lain termasuk penyakit gusi, karies gigi, mulut kering, merokok, gigi palsu yang tidak dibersihkan, dan sesetengah keadaan perubatan.','<b>Apa yang membantu:</b> berus gigi dua kali sehari, bersihkan celah gigi, bersihkan lidah, bersihkan gigi palsu setiap hari, minum air dan elakkan merokok.','<b>Ubat kumur</b> hanya menyegarkan nafas untuk seketika dan tidak merawat puncanya.','<b>Berjumpa doktor pergigian</b> jika nafas berbau berterusan walaupun pembersihan telah baik. Doktor pergigian boleh memeriksa penyakit gusi, karies atau punca lain dan mungkin menasihati anda berjumpa doktor.'],
38:['<b>Gigi susu</b> biasanya mula tumbuh pada usia kira-kira enam bulan, dan kebanyakan kanak-kanak mempunyai set penuh 20 batang gigi pada usia kira-kira tiga tahun.','<b>Gigi kekal</b> mula tumbuh pada usia kira-kira enam tahun, bermula dengan geraham pertama dan gigi depan bawah. Gigi susu tanggal secara beransur-ansur sehingga kira-kira usia dua belas tahun.','<b>Gigi geraham bongsu</b> biasanya tumbuh antara usia kira-kira 17 dan 25 tahun. Sesetengahnya tidak tumbuh sepenuhnya dan mungkin perlu diperiksa oleh doktor pergigian.','<b>Gigi tumbuh</b> boleh menyebabkan air liur meleleh, gusi sakit dan kerap menangis. Gelang gigit yang bersih mungkin membantu. Tanya doktor pergigian atau doktor sebelum menggunakan sebarang ubat atau gel.','<b>Masa tumbuh berbeza-beza.</b> Jika gigi tumbuh jauh lebih awal atau lewat daripada yang dijangka, tanya doktor pergigian.'],
39:['<b>Jika gigi kekal tercabut:</b> pegang pada mahkota, bukan akar, dan jangan gosok. Jika kotor, bilas dengan lembut menggunakan susu atau air bersih dan cuba letakkan semula ke dalam soketnya. Jika tidak dapat, simpan dalam susu dan berjumpa doktor pergigian dengan segera. Jangan letakkan semula gigi susu.','<b>Gigi patah atau serpih:</b> kumur mulut, simpan serpihan dalam susu dan berjumpa doktor pergigian secepat mungkin.','<b>Sakit gigi:</b> kumur dengan air suam, bersihkan celah gigi dengan lembut dan berjumpa doktor pergigian. Jangan letakkan aspirin atau ubat lain pada gusi.','<b>Bengkak pada muka, demam, atau sukar menelan atau bernafas</b> memerlukan perhatian perubatan segera. Pergi ke hospital atau klinik yang terdekat.','<b>Pencegahan:</b> pakai pelindung mulut untuk sukan bersentuhan, pakai tali pinggang keledar dan elakkan menggigit benda yang sangat keras.'],
40:['<b>Mengapa perlu berjumpa secara berkala?</b> Banyak masalah, seperti karies awal, penyakit gusi dan kanser mulut, tidak menyebabkan sakit pada mulanya. Pemeriksaan berkala mengesannya lebih awal.','<b>Apa yang berlaku:</b> doktor pergigian memeriksa gigi, gusi, lidah dan lapisan mulut anda, mungkin mengambil sinar-X jika perlu, dan memberi nasihat tentang penjagaan di rumah.','<b>Kekerapan:</b> bergantung pada risiko anda mendapat penyakit pergigian. Tanya doktor pergigian anda berapa kerap anda perlu datang.','<b>Bawa</b> senarai ubat dan keadaan kesihatan anda, dan beritahu doktor pergigian tentang sebarang perubahan pada mulut anda.','<b>Kanak-kanak:</b> bawa mereka untuk lawatan pertama apabila gigi pertama tumbuh, dan teruskan lawatan berkala.','<b>Jangan tunggu sakit:</b> berjumpa doktor pergigian lebih awal jika anda mengalami sakit, gusi berdarah, bengkak, ulser mulut yang tidak sembuh atau gigi goyang.'],
41:['<b>Mitos:</b> gigi susu tidak penting kerana akan tanggal. <b>Fakta:</b> gigi susu membantu makan dan bercakap serta membimbing gigi dewasa ke tempatnya. Karies boleh menyebabkan sakit dan jangkitan.','<b>Mitos:</b> memberus lebih kuat membersihkan lebih baik. <b>Fakta:</b> memberus dengan kuat boleh merosakkan gusi dan enamel. Memberus dengan lembut dan teliti adalah paling baik.','<b>Mitos:</b> gusi berdarah bermakna anda patut berhenti memberus. <b>Fakta:</b> pendarahan biasanya bermakna plak dan gusi radang. Teruskan membersihkan dengan lembut dan berjumpa doktor pergigian jika berterusan.','<b>Mitos:</b> hanya gula menyebabkan karies. <b>Fakta:</b> bakteria menukarkan gula dan karbohidrat lain yang boleh ditapai menjadi asid. Kekerapan makan makanan manis penting, begitu juga membuang plak dan fluorida.','<b>Mitos:</b> ubat kumur boleh menggantikan memberus. <b>Fakta:</b> tidak boleh. Ubat kumur hanyalah tambahan.','<b>Mitos:</b> vaping selamat untuk mulut. <b>Fakta:</b> vaping tidak bebas risiko. Ia boleh mengeringkan mulut dan merengsa gusi, dan mungkin mengandungi nikotin.','<b>Mitos:</b> jika tidak sakit, gigi saya baik-baik sahaja. <b>Fakta:</b> karies awal dan penyakit gusi selalunya tidak menyebabkan sakit, jadi pemeriksaan berkala adalah penting.']}},
zh:{n:['口腔解剖与牙齿结构','口腔潜在恶性疾患（OPMD）','氟化物认知','饮酒与口腔健康','牙齿酸蚀','口臭','牙齿萌出与发育','牙外伤与牙科急症','定期牙科检查','牙科常见误区与事实'],sb:'<b>另请参阅：</b>',
cat:['认识您的口腔','牙科疾病与问题','癌症、危险习惯与认知','预防与健康习惯','全身健康与急症'],an:['牙釉质','牙本质','牙髓（神经）','牙龈','牙槽骨','牙齿及其支持组织示意图。'],
m:{32:['<b>牙齿的构成：</b>牙冠是看得见的部分，牙根固定在颌骨中。牙釉质是牙冠坚硬的外层，其下是牙本质，中央的牙髓含有神经和血管。','<b>支持组织：</b>牙龈包围牙齿，牙周膜和骨头把牙齿固定在原位。','<b>您的牙齿：</b>成人通常最多有32颗恒牙，包括门牙、尖牙、前磨牙和磨牙。儿童有20颗乳牙。','<b>牙釉质一旦丧失就不能再生</b>，但早期的损伤可以通过氟来强化。','<b>唾液</b>通过冲走食物残渣、中和酸并提供矿物质来保护牙齿。'],
33:['<b>它们是什么？</b>口腔潜在恶性疾患（OPMD）是口腔黏膜的改变，如白色或红色斑块，有时可能转变为癌症，但大多数不会。','<b>例子：</b>白斑、红斑和口腔黏膜下纤维化（脸颊变硬，常与嚼食槟榔有关）。','<b>警示信号：</b>擦不掉的白色或红色斑块、吃辛辣食物时有灼烧感、嘴巴难以张大，或久不愈合的溃疡。','<b>风险因素：</b>烟草、槟榔和酒精。戒除这些习惯可降低风险。','<b>该怎么做：</b>请勿自行诊断。若任何斑块或变化持续超过两周，请看牙医。牙医可能会进行观察或取一小块组织检查（活检）。'],
34:['<b>氟的作用：</b>氟能强化牙釉质，并帮助早期蛀牙修复。它是预防蛀牙最有效的方法之一。','<b>来源：</b>含氟牙膏、含氟漱口水、专业涂氟，以及某些地方的含氟饮用水。','<b>专业涂氟：</b>牙科团队可能会涂抹氟保护漆，尤其适合儿童和蛀牙高风险人群。','<b>安全使用：</b>按年龄使用适量牙膏，用完吐出，并把牙膏放在幼儿拿不到的地方。牙齿发育期间吞下过多氟，可能出现白色或褐色斑点（氟斑牙）。','!各年龄段的氟用量和浓度：有待对照马来西亚卫生部最新指南核实。'],
35:['<b>饮酒与口腔癌：</b>饮酒会增加口腔癌的风险，与烟草同时使用时风险更高。','<b>其他影响：</b>酒精可能使口腔干燥并刺激牙龈，含糖的酒类和调酒饮料也可能导致蛀牙。','<b>酸性：</b>有些酒类呈酸性，会磨损牙釉质。','<b>降低风险：</b>限制或避免饮酒，同时多喝水，喝了酸性饮料后不要立刻刷牙。','<b>何时寻求专业帮助：</b>久不愈合的溃疡、白色或红色斑块，或持续的口腔疼痛。可向诊所咨询减少饮酒的支持。'],
36:['<b>什么是牙齿酸蚀？</b>牙齿酸蚀是由非细菌产生的酸（如酸性食物和饮料或胃酸）造成的牙釉质流失。','<b>原因：</b>碳酸饮料和能量饮料、运动饮料、果汁、柑橘类水果，以及反复呕吐或胃酸反流。','<b>症状：</b>牙齿敏感、牙齿表面光滑发亮或发黄，以及牙齿边缘磨损或变圆。','<b>预防：</b>限制酸性饮料，随餐饮用或用吸管，之后用清水漱口并等一会儿再刷牙。使用含氟牙膏。','<b>请看牙医：</b>若有胃酸反流、反复呕吐，或牙齿变得敏感或磨损。'],
37:['<b>什么是口臭？</b>口臭是持续的口气不佳。它很常见，而且通常可以治疗。','<b>原因：</b>大多数来自舌头以及牙缝和牙龈处的细菌。其他原因包括牙龈疾病、蛀牙、口干、吸烟、假牙未清洁，以及某些疾病。','<b>有什么帮助：</b>每天刷牙两次、清洁牙缝、清洁舌头、每天清洁假牙、多喝水并避免吸烟。','<b>漱口水</b>只能让口气暂时清新，不能治疗原因。','<b>请看牙医：</b>若清洁得很好口臭仍然持续。牙医可检查是否有牙龈疾病、蛀牙或其他原因，并可能建议您看医生。'],
38:['<b>乳牙</b>通常在约六个月大时开始萌出，大多数孩子在三岁左右长齐20颗。','<b>恒牙</b>在约六岁开始萌出，先是第一磨牙和下前牙。乳牙会逐渐脱落，直到约十二岁。','<b>智齿</b>通常在约17至25岁之间萌出。有些智齿不能完全长出，可能需要牙医检查。','<b>出牙</b>可能引起流口水、牙龈疼痛和烦躁。干净的牙胶可能有帮助。使用任何药物或凝胶前，请先咨询牙医或医生。','<b>萌出时间因人而异。</b>若牙齿比预期早很多或晚很多，请咨询牙医。'],
39:['<b>恒牙被撞掉时：</b>拿住牙冠而不是牙根，不要擦洗。如果脏了，用牛奶或干净的水轻轻冲洗，并尽量把它放回牙槽。如果做不到，把牙齿放在牛奶中，并立即看牙医。不要把乳牙放回去。','<b>牙齿折断或崩裂：</b>漱口，把碎片放在牛奶中，并尽快看牙医。','<b>牙痛：</b>用温水漱口，轻轻清洁牙缝，并看牙医。不要把阿司匹林或其他药物放在牙龈上。','<b>脸部肿胀、发烧，或吞咽、呼吸困难</b>需要紧急就医。请前往最近的医院或诊所。','<b>预防：</b>参加接触性运动时佩戴护牙套，系好安全带，避免咬很硬的东西。'],
40:['<b>为什么要定期检查？</b>许多问题，如早期蛀牙、牙龈疾病和口腔癌，一开始并不疼痛。检查能及早发现。','<b>检查内容：</b>牙医会检查牙齿、牙龈、舌头和口腔黏膜，必要时拍X光片，并就居家护理给出建议。','<b>多久一次：</b>取决于您患牙科疾病的风险。请询问牙医您应该多久来一次。','<b>请带上</b>您的用药和健康状况清单，并告诉牙医口腔里的任何变化。','<b>儿童：</b>第一颗牙长出来就带他们首次看牙，并坚持定期复诊。','<b>不要等到疼痛才看：</b>若有疼痛、牙龈出血、肿胀、久不愈合的口腔溃疡或牙齿松动，请尽早看牙医。'],
41:['<b>误区：</b>乳牙会掉，所以不重要。<b>事实：</b>乳牙有助于进食和说话，并引导恒牙长到正确位置。蛀牙会引起疼痛和感染。','<b>误区：</b>用力刷牙刷得更干净。<b>事实：</b>用力刷牙会损伤牙龈和牙釉质。轻柔而彻底最有效。','<b>误区：</b>牙龈出血就该停止刷牙。<b>事实：</b>出血通常意味着有牙菌斑和牙龈发炎。请继续轻柔清洁，若持续出血请看牙医。','<b>误区：</b>只有糖会导致蛀牙。<b>事实：</b>细菌会把糖和其他可发酵碳水化合物变成酸。吃甜食的次数很重要，清除牙菌斑和用氟也同样重要。','<b>误区：</b>漱口水可以取代刷牙。<b>事实：</b>不能。漱口水只是额外的辅助。','<b>误区：</b>电子烟对口腔是安全的。<b>事实：</b>电子烟并非没有风险。它可能使口腔干燥、刺激牙龈，而且可能含有尼古丁。','<b>误区：</b>不痛就说明牙齿没问题。<b>事实：</b>早期蛀牙和牙龈疾病往往没有疼痛，所以定期检查很重要。']}}};

en:[['<b>Primary tooth eruption and teething:</b> the first teeth usually appear from around six months. Teething can cause drooling and sore gums, and a clean teething ring may help.','<b>Bottle-feeding and early childhood caries:</b> do not let a baby sleep with a bottle of milk or a sweet drink, and do not add sugar. Move to a cup when your health team advises.','<b>Thumb sucking and pacifiers:</b> sucking is normal in babies. If it continues beyond the toddler years it can affect how the teeth and jaws develop, so ask your dentist for advice. Never dip a pacifier in sugar or honey.','<b>First dental visit:</b> take your baby when the first teeth appear, and ask the dental team about fluoride and feeding.'],
['<b>Primary teeth still matter:</b> they hold space for the adult teeth. Decay in baby teeth can cause pain and infection.','<b>Fluoride varnish:</b> your dental team may paint fluoride varnish on the teeth to help prevent decay, especially in children at higher risk.','<b>Habits:</b> long-term thumb sucking or pacifier use can affect the bite. Ask your dentist for help to stop.','<b>Healthy eating:</b> keep sweet snacks and drinks to mealtimes, and offer water, fruit and vegetables.'],
['<b>Mixed dentition:</b> baby and permanent teeth are in the mouth together. The first permanent molars appear at about six years, behind the baby teeth, and are often mistaken for baby teeth. Brush them well.','<b>Pit and fissure sealants:</b> a thin protective coating placed on the chewing surfaces of back teeth by a dental professional helps prevent decay in deep grooves.','<b>Fluoride varnish and caries prevention:</b> ask your dentist whether your child needs fluoride varnish.','<b>Sugar reduction:</b> choose water and plain milk, and keep sweets for mealtimes.','<b>Sports:</b> wear a mouthguard for contact sports.'],
['<b>Braces:</b> brackets and wires trap plaque, so clean around them carefully and use interdental brushes.','<b>Wisdom teeth:</b> they usually appear between about 17 and 25 years of age. If you have pain, swelling or gum covering part of a tooth, see your dentist.','<b>Sports mouthguards:</b> wear a well-fitting mouthguard for contact sports to protect your teeth and lips.','<b>Smoking and vaping:</b> both affect the gums and breath, and nicotine is addictive. Ask for help to quit.','<b>Sugary drinks:</b> frequent soft drinks, energy drinks and sweetened tea or coffee cause decay and erosion.','<b>Puberty:</b> hormonal changes can make the gums more likely to become red and swollen, so clean carefully along the gum line.'],
['<b>Gum disease prevention:</b> clean between your teeth daily, do not smoke and see your dentist regularly.','<b>Dental caries:</b> adults can still get decay, including around old fillings and at the gum line. Use fluoride toothpaste.','<b>Sensitivity and erosion:</b> brush gently and limit acidic drinks.','<b>Smoking and oral health:</b> smoking harms the gums and raises the risk of oral cancer.','<b>Preventive care:</b> regular check-ups and professional cleaning.'],
['<b>Root caries:</b> when the gums recede, the tooth roots are exposed and decay more easily. Use fluoride toothpaste and clean carefully.','<b>Dry mouth:</b> many medicines reduce saliva. Sip water often and ask your dentist or pharmacist.','<b>Gum recession:</b> brush gently with a soft brush so that the gums and roots are not worn away.','<b>Tooth loss and dentures:</b> keep your natural teeth for as long as possible. Clean dentures every day and take them out at night as advised.','<b>Reduced dexterity and help from carers:</b> adapted handles and powered brushes can help, and carers can assist.']],
ms:[['<b>Gigi susu tumbuh dan gigi tumbuh (teething):</b> gigi pertama biasanya muncul pada usia kira-kira enam bulan. Ia boleh menyebabkan air liur meleleh dan gusi sakit; gelang gigit yang bersih mungkin membantu.','<b>Penyusuan botol dan karies awal kanak-kanak:</b> jangan biarkan bayi tidur dengan botol susu atau minuman manis, dan jangan tambah gula. Beralih kepada cawan seperti dinasihatkan oleh pasukan kesihatan anda.','<b>Menghisap ibu jari dan puting tiruan:</b> menghisap adalah normal pada bayi. Jika berterusan selepas usia kanak-kanak kecil, ia boleh menjejaskan perkembangan gigi dan rahang, jadi dapatkan nasihat doktor pergigian. Jangan sekali-kali mencelup puting tiruan ke dalam gula atau madu.','<b>Lawatan pergigian pertama:</b> bawa bayi anda apabila gigi pertama tumbuh, dan tanya pasukan pergigian tentang fluorida dan pemakanan.'],
['<b>Gigi susu masih penting:</b> ia menyimpan ruang untuk gigi dewasa. Karies pada gigi susu boleh menyebabkan sakit dan jangkitan.','<b>Varnis fluorida:</b> pasukan pergigian mungkin menyapu varnis fluorida pada gigi untuk membantu mencegah karies, terutamanya pada kanak-kanak yang berisiko lebih tinggi.','<b>Tabiat:</b> menghisap ibu jari atau puting tiruan untuk jangka masa panjang boleh menjejaskan gigitan. Minta bantuan doktor pergigian untuk menghentikannya.','<b>Pemakanan sihat:</b> hadkan snek dan minuman manis pada waktu makan, dan berikan air, buah-buahan dan sayur-sayuran.'],
['<b>Gigi bercampur:</b> gigi susu dan gigi kekal berada dalam mulut serentak. Geraham kekal pertama tumbuh pada usia kira-kira enam tahun di belakang gigi susu dan sering disangka gigi susu. Berus dengan teliti.','<b>Pelindung rekahan dan lekuk (sealant):</b> salutan pelindung nipis yang diletakkan oleh profesional pergigian pada permukaan kunyahan gigi belakang membantu mencegah karies pada alur yang dalam.','<b>Varnis fluorida dan pencegahan karies:</b> tanya doktor pergigian sama ada anak anda memerlukan varnis fluorida.','<b>Mengurangkan gula:</b> pilih air dan susu tawar, dan hadkan gula-gula pada waktu makan.','<b>Sukan:</b> pakai pelindung mulut untuk sukan bersentuhan.'],
['<b>Pendakap:</b> braket dan wayar memerangkap plak, jadi bersihkan sekelilingnya dengan teliti dan gunakan berus interdental.','<b>Gigi geraham bongsu:</b> ia biasanya tumbuh antara usia kira-kira 17 dan 25 tahun. Jika ada sakit, bengkak atau gusi yang menutupi sebahagian gigi, berjumpa doktor pergigian.','<b>Pelindung mulut sukan:</b> pakai pelindung mulut yang sesuai untuk sukan bersentuhan bagi melindungi gigi dan bibir.','<b>Merokok dan vaping:</b> kedua-duanya menjejaskan gusi dan nafas, dan nikotin menagihkan. Minta bantuan untuk berhenti.','<b>Minuman bergula:</b> minuman berkarbonat, minuman bertenaga serta teh atau kopi bermanis yang kerap diminum menyebabkan karies dan hakisan gigi.','<b>Akil baligh:</b> perubahan hormon boleh menjadikan gusi lebih mudah merah dan bengkak, jadi bersihkan dengan teliti di sepanjang garis gusi.'],
['<b>Pencegahan penyakit gusi:</b> bersihkan celah gigi setiap hari, jangan merokok dan berjumpa doktor pergigian secara berkala.','<b>Karies gigi:</b> orang dewasa masih boleh mendapat karies, termasuk di sekeliling tampalan lama dan pada garis gusi. Gunakan ubat gigi berfluorida.','<b>Kepekaan dan hakisan:</b> berus dengan lembut dan hadkan minuman berasid.','<b>Merokok dan kesihatan mulut:</b> merokok merosakkan gusi dan meningkatkan risiko kanser mulut.','<b>Penjagaan pencegahan:</b> pemeriksaan berkala dan pembersihan profesional.'],
['<b>Karies akar:</b> apabila gusi surut, akar gigi terdedah dan lebih mudah reput. Gunakan ubat gigi berfluorida dan bersihkan dengan teliti.','<b>Mulut kering:</b> banyak ubat mengurangkan air liur. Kerap hirup air dan tanya doktor pergigian atau ahli farmasi.','<b>Gusi surut:</b> berus dengan lembut menggunakan berus lembut supaya gusi dan akar tidak menjadi haus.','<b>Kehilangan gigi dan gigi palsu:</b> kekalkan gigi asli selama mungkin. Bersihkan gigi palsu setiap hari dan tanggalkan pada waktu malam seperti dinasihatkan.','<b>Ketangkasan berkurangan dan bantuan penjaga:</b> pemegang yang diubah suai dan berus gigi berkuasa boleh membantu, dan penjaga boleh memberi bantuan.']],
zh:[['<b>乳牙萌出与出牙：</b>第一颗牙通常在约六个月大时长出。出牙可能引起流口水和牙龈疼痛，干净的牙胶可能有帮助。','<b>奶瓶喂养与幼儿龋齿：</b>不要让宝宝含着奶瓶或甜饮料入睡，也不要加糖。请按医护团队的建议改用杯子。','<b>吸吮拇指和安抚奶嘴：</b>婴儿吸吮是正常的。若在幼儿期之后仍持续，可能影响牙齿和颌骨发育，请咨询牙医。切勿把安抚奶嘴蘸糖或蜂蜜。','<b>首次看牙：</b>第一颗牙长出来就带宝宝看牙，并向牙科团队询问氟和喂养的问题。'],
['<b>乳牙仍然重要：</b>它们为恒牙留出位置。乳牙蛀牙会引起疼痛和感染。','<b>涂氟：</b>牙科团队可能会在牙齿上涂氟保护漆来帮助预防蛀牙，尤其适合风险较高的儿童。','<b>习惯：</b>长期吸吮拇指或使用安抚奶嘴可能影响咬合。请向牙医寻求帮助戒除。','<b>健康饮食：</b>把甜食和甜饮料安排在正餐时间，多给孩子喝水、吃水果和蔬菜。'],
['<b>替牙期：</b>乳牙和恒牙同时在口腔中。第一颗恒磨牙在约六岁时长在乳牙后面，常被误认为乳牙。请把它们刷干净。','<b>窝沟封闭：</b>由牙科专业人员在后牙咬合面涂上一层薄薄的保护层，有助于预防深沟中的蛀牙。','<b>涂氟与预防蛀牙：</b>请询问牙医孩子是否需要涂氟。','<b>减少糖分：</b>选择清水和无糖鲜奶，把糖果安排在正餐时间。','<b>运动：</b>参加接触性运动时佩戴护牙套。'],
['<b>牙套：</b>托槽和钢丝容易积聚牙菌斑，请仔细清洁周围，并使用牙缝刷。','<b>智齿：</b>通常在约17至25岁之间萌出。若有疼痛、肿胀或牙龈盖住部分牙齿，请看牙医。','<b>运动护牙套：</b>参加接触性运动时佩戴合适的护牙套，保护牙齿和嘴唇。','<b>吸烟和电子烟：</b>两者都会影响牙龈和口气，而且尼古丁会成瘾。请寻求戒烟帮助。','<b>含糖饮料：</b>经常喝汽水、能量饮料和加糖的茶或咖啡，会导致蛀牙和牙齿酸蚀。','<b>青春期：</b>激素变化会使牙龈更容易发红肿胀，请沿牙龈线仔细清洁。'],
['<b>预防牙龈疾病：</b>每天清洁牙缝，不吸烟，并定期看牙医。','<b>龋齿：</b>成人仍然会蛀牙，包括旧补牙周围和牙龈线处。请使用含氟牙膏。','<b>敏感与酸蚀：</b>轻柔刷牙，并限制酸性饮料。','<b>吸烟与口腔健康：</b>吸烟会伤害牙龈，并增加口腔癌风险。','<b>预防性护理：</b>定期检查和专业洁牙。'],
['<b>根面龋：</b>牙龈退缩后牙根外露，更容易蛀牙。请使用含氟牙膏并仔细清洁。','<b>口干：</b>许多药物会减少唾液。请常喝水，并咨询牙医或药剂师。','<b>牙龈退缩：</b>用软毛牙刷轻柔刷牙，避免磨损牙龈和牙根。','<b>掉牙与假牙：</b>尽可能保留天然牙。每天清洁假牙，并按建议晚上取下。','<b>灵活性下降与照护者协助：</b>改装的刷柄和电动牙刷可能有帮助，照护者也可以协助。']]};

var N2={en:{n:['Cancer Treatment (Chemotherapy and Radiotherapy)','Multiple Medications'],m:{42:['<b>Why it matters:</b> chemotherapy and radiotherapy to the head and neck can cause mouth sores, dry mouth, infections, taste changes and tooth decay.','<b>Before treatment:</b> if possible, see a dentist before cancer treatment starts so that dental problems can be treated first. Make sure your cancer team and your dentist know about each other.','<b>During treatment:</b> brush gently with a very soft brush and fluoride toothpaste, rinse with plain water or as advised, and avoid alcohol-containing mouthwash, spicy foods and tobacco.','<b>Dry mouth and sores:</b> sip water often, keep the lips moist and ask your team about saliva substitutes or rinses for mouth sores.','<b>Seek help promptly</b> for painful mouth sores that stop you eating, white patches, bleeding, swelling, fever or loose teeth. If you have had radiotherapy to the jaws, tell your dentist before any tooth extraction.','!References for this topic: pending clinical review by the dental team.'],43:['<b>Why it matters:</b> many medicines, for example for blood pressure, depression, allergies, pain and bladder problems, reduce saliva and cause dry mouth.','<b>Effects:</b> dry mouth raises the risk of tooth decay, gum problems, mouth infections and denture discomfort. Some medicines can also cause gum overgrowth or change taste.','<b>Oral hygiene:</b> brush twice a day with fluoride toothpaste, clean between your teeth, sip water often and avoid sugary drinks. Ask your pharmacist about sugar-free versions of liquid medicines.','<b>Tell your dentist</b> about all your medicines, including herbal products, and bring a list to every visit. Do not stop any medicine without asking your doctor.','<b>See your dentist</b> if your mouth feels dry or you have sores, gum swelling or a change in taste.','!References for this topic: pending clinical review by the dental team.']}},
ms:{n:['Rawatan Kanser (Kemoterapi dan Radioterapi)','Penggunaan Pelbagai Ubat'],m:{42:['<b>Mengapa ini penting:</b> kemoterapi dan radioterapi pada kepala dan leher boleh menyebabkan luka mulut, mulut kering, jangkitan, perubahan rasa dan karies gigi.','<b>Sebelum rawatan:</b> jika boleh, berjumpa doktor pergigian sebelum rawatan kanser bermula supaya masalah pergigian dapat dirawat dahulu. Pastikan pasukan kanser dan doktor pergigian anda saling mengetahui.','<b>Semasa rawatan:</b> berus dengan lembut menggunakan berus yang sangat lembut dan ubat gigi berfluorida, kumur dengan air kosong atau seperti dinasihatkan, dan elakkan ubat kumur beralkohol, makanan pedas dan tembakau.','<b>Mulut kering dan luka:</b> kerap hirup air, kekalkan bibir lembap dan tanya pasukan anda tentang pengganti air liur atau cecair kumur untuk luka mulut.','<b>Dapatkan bantuan segera</b> jika luka mulut yang sakit menyukarkan anda makan, ada tompok putih, pendarahan, bengkak, demam atau gigi goyang. Jika anda pernah menjalani radioterapi pada rahang, beritahu doktor pergigian sebelum sebarang pencabutan gigi.','!Rujukan bagi topik ini: menunggu semakan klinikal oleh pasukan pergigian.'],43:['<b>Mengapa ini penting:</b> banyak ubat, contohnya untuk tekanan darah, kemurungan, alahan, sakit dan masalah pundi kencing, mengurangkan air liur dan menyebabkan mulut kering.','<b>Kesan:</b> mulut kering meningkatkan risiko karies gigi, masalah gusi, jangkitan mulut dan ketidakselesaan gigi palsu. Sesetengah ubat juga boleh menyebabkan gusi membesar atau mengubah rasa.','<b>Kebersihan mulut:</b> berus gigi dua kali sehari dengan ubat gigi berfluorida, bersihkan celah gigi, kerap hirup air dan elakkan minuman bergula. Tanya ahli farmasi anda tentang versi tanpa gula bagi ubat cecair.','<b>Beritahu doktor pergigian</b> tentang semua ubat anda, termasuk produk herba, dan bawa senarai pada setiap lawatan. Jangan hentikan sebarang ubat tanpa bertanya doktor anda.','<b>Berjumpa doktor pergigian</b> jika mulut terasa kering atau anda mengalami luka, gusi bengkak atau perubahan rasa.','!Rujukan bagi topik ini: menunggu semakan klinikal oleh pasukan pergigian.']}},
zh:{n:['癌症治疗（化疗和放疗）','同时服用多种药物'],m:{42:['<b>为什么重要：</b>头颈部的化疗和放疗可能引起口腔溃疡、口干、感染、味觉改变和蛀牙。','<b>治疗前：</b>如有可能，请在癌症治疗开始前看牙医，以便先处理牙齿问题。请让您的癌症治疗团队和牙医互相了解情况。','<b>治疗期间：</b>用非常软的牙刷和含氟牙膏轻柔刷牙，用清水或按建议漱口，避免含酒精的漱口水、辛辣食物和烟草。','<b>口干和溃疡：</b>常喝水，保持嘴唇湿润，并向治疗团队咨询人工唾液或缓解口腔溃疡的漱口液。','<b>请及时求助：</b>若口腔溃疡疼痛到无法进食，或出现白色斑块、出血、肿胀、发烧或牙齿松动。如果您的颌骨接受过放疗，请在拔牙前告诉牙医。','!本主题的参考资料：有待牙科团队临床审核。'],43:['<b>为什么重要：</b>许多药物，例如治疗高血压、抑郁、过敏、疼痛和膀胱问题的药物，会减少唾液并引起口干。','<b>影响：</b>口干会增加蛀牙、牙龈问题、口腔感染和假牙不适的风险。有些药物还可能引起牙龈增生或改变味觉。','<b>口腔卫生：</b>每天用含氟牙膏刷牙两次，清洁牙缝，常喝水，避免含糖饮料。请向药剂师询问液体药物的无糖版本。','<b>请告诉牙医</b>您服用的所有药物，包括草药产品，并在每次就诊时带上清单。没有询问医生，不要自行停药。','<b>请看牙医：</b>若口腔感到干燥，或出现溃疡、牙龈肿胀或味觉改变。','!本主题的参考资料：有待牙科团队临床审核。']}}};

 car:'<b>In Malaysia:</b> the National Oral Health Survey of Pre-School Children 2015 found that 71.3% of preschool children had dental caries, down from 87.1% in 1995 and 76.2% in 2005. Children with caries in their baby teeth are about three times more likely to get caries in their permanent teeth.',

 x:['<b>Pemeriksaan Lift the Lip (selak bibir):</b> sekali sebulan, selak bibir anak anda dengan lembut dan lihat gigi depan. Tompok putih atau coklat boleh menjadi tanda awal karies awal kanak-kanak. Berjumpa doktor pergigian jika anda melihatnya.','<b>Membersihkan gigi bayi:</b> apabila gigi tumbuh, bersihkan gigi dan gusi dengan berus gigi lembut dan air kosong selepas makan dan sebelum tidur. Bawa bayi anda untuk pemeriksaan pergigian pertama sebelum usia 12 bulan.']},

if(DEV.indexOf(cur)>-1){var p=M[lang][cur];

p.forEach(function(x){if(x[0]==="!")h+='<div class="flag">⚠ <b>'+t.rev+'</b><br>'+x.slice(1)+'</div>'});
