<style>

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 system-ui,-apple-system,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--bd);z-index:5}
.bar{max-width:880px;margin:auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--navy);letter-spacing:.5px;cursor:pointer;border:0;background:none;font-size:20px;color:var(--ink)}
.langs{display:flex;gap:6px}

main{max-width:880px;margin:auto;padding:20px 16px 40px}
.hero{background:linear-gradient(135deg,var(--mint),var(--card));border-radius:28px;padding:28px 22px;text-align:center}

.btn{background:var(--teal);color:#fff;border:0;border-radius:16px;padding:14px 26px;font-weight:700;font-size:19px;margin-top:10px}
.btn.alt{background:var(--navy);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:16px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;text-align:left;color:var(--ink);width:100%}
button.card:hover{border-color:var(--teal)}
.ico{font-size:40px;line-height:1}

.pill.w{background:var(--warn);color:var(--warnt)}
.flag{background:var(--warn);color:var(--warnt);border-radius:14px;padding:12px 14px;margin:12px 0}
ul{padding-left:22px}li{margin:8px 0}
.opt{display:block;width:100%;text-align:left;margin:8px 0;border:2px solid var(--bd);background:var(--card);color:var(--ink);border-radius:14px;padding:14px;font-weight:600}
.opt.ok{border-color:#1a9a55;background:#d9f5e5;color:#0a3d20}
.opt.no{border-color:#c0392b;background:#fde4e0;color:#5a130b}
.step{display:flex;gap:12px;align-items:center;margin:10px 0}
.num{flex:none;width:40px;height:40px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:800}
.note{font-size:14px;color:var(--mut)}
.banner{background:var(--navy);color:var(--bg);text-align:center;font-size:13px;padding:6px 10px}
footer{max-width:880px;margin:auto;padding:0 16px 30px;font-size:14px;color:var(--mut);text-align:center}
.qrbox{background:#fff;border:6px solid var(--navy);border-radius:20px;padding:12px;width:220px;margin:12px auto;text-align:center}
.qrbox svg{display:block;width:100%}
.qrbox span{color:#0b2545;font-size:12px;font-weight:700}
.bk{border:0;background:none;color:var(--teal);font-weight:700;padding:6px 0}.why{background:var(--mint);border-radius:20px;padding:16px;margin:16px 0}.why h3{margin-bottom:8px}.vis{text-align:center}.vis svg{width:100%;max-width:300px;display:block;margin:0 auto 8px}

.demo{width:100%;max-width:320px;display:block;margin:0 auto 8px}

@keyframes circ{0%{transform:translate(0,-8px)}25%{transform:translate(8px,0)}50%{transform:translate(0,8px)}75%{transform:translate(-8px,0)}100%{transform:translate(0,-8px)}}
@keyframes circs{0%{transform:translate(0,-4px)}25%{transform:translate(4px,0)}50%{transform:translate(0,4px)}75%{transform:translate(-4px,0)}100%{transform:translate(0,-4px)}}
@keyframes vs{0%{transform:translate(0,0)}8%{transform:translate(-2px,0)}16%{transform:translate(2px,0)}24%{transform:translate(-2px,0)}32%{transform:translate(2px,0)}40%{transform:translate(-2px,0)}50%{transform:translate(0,0)}100%{transform:translate(12px,-12px)}}
.an{animation-iteration-count:infinite}.a-b{animation:vib .35s infinite}.a-m{animation:vs 3.2s infinite ease-in-out}.a-s{animation:vs 4s infinite ease-in-out}.a-f{animation:circ 2s linear infinite}.a-c{animation:circs 1.2s linear infinite}

.ph{border:3px dashed var(--coral);border-radius:18px;padding:14px 16px;margin:14px 0;background:var(--card)}.ph .tg{display:inline-block;background:var(--coral);color:#0b2a3f;font-weight:800;font-size:13px;padding:2px 10px;border-radius:999px;margin-bottom:6px}.ph ul{margin:8px 0 0;padding-left:20px;font-size:15px}.ph li{margin:4px 0}
.qa{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 16px;margin:10px 0}.qa summary{font-weight:700;cursor:pointer;font-size:18px}.qa p{margin:8px 0 0}
.bk{display:none}.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:15px;margin:4px 0 10px}.crumbs button{background:none;border:0;color:var(--teal);font-weight:700;padding:6px 2px;text-decoration:underline}.crumbs span{color:var(--mut)}
.tabs{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}.tabs button{border:2px solid var(--teal);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:700}.tabs button.on{background:var(--navy);color:var(--bg)}
.a-ib{animation:ib 2.4s ease-in-out infinite}.a-fl{animation:fl 2s ease-in-out infinite}@keyframes ib{0%,100%{transform:translateX(-30px)}50%{transform:translateX(8px)}}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

.mk{animation:mk 12s infinite}@keyframes mk{0%{opacity:.3}4%,12%{opacity:1}16%,100%{opacity:.3}}
.sec{font-size:22px;margin:28px 0 4px;padding-bottom:6px;border-bottom:3px solid var(--teal)}.sp{display:inline-block;margin-top:12px;padding:2px 12px;border-radius:999px;background:rgba(255,255,255,.25);font-weight:700;font-size:14px}

var M={
en:{0:["Brush twice a day, for about 2 minutes each time.","Place the brush with the bristles tilted slightly towards the gumline and use short, gentle strokes (modified Bass technique, for older children and adults).","Young children: small circular movements (Fones technique) with a parent helping.","Clean the outer, inner and chewing surfaces of every tooth, including along the gumline.","Spit out the toothpaste. Do not rinse with water straight away."],
2:["Fluoride toothpaste helps strengthen teeth and prevent tooth decay.","Do not swallow toothpaste. Spit it out after brushing.","Young children need an adult to supervise brushing.","!Fluoride concentration and amount by age: pending clinical review against current Ministry of Health guidance."],
3:["Brushing cannot reach between teeth. Cleaning there once a day helps protect your gums.","Floss: slide it gently between teeth, curve it in a C shape around each tooth and move it up and down.","Interdental brushes may suit people with wider gaps, braces or gum problems. Ask your dental team for the right size.","With braces, use a floss threader or interdental brush."]},
ms:{0:["Memberus gigi dua kali sehari, kira-kira 2 minit setiap kali.","Letakkan berus dengan bulu condong sedikit ke arah garis gusi dan gunakan gerakan pendek yang lembut (teknik Bass terubah suai, untuk kanak-kanak yang lebih besar dan dewasa).","Kanak-kanak kecil: gerakan bulatan kecil (teknik Fones) dengan bantuan ibu bapa.","Bersihkan permukaan luar, dalam dan pengunyahan setiap gigi, termasuk di sepanjang garis gusi.","Ludah ubat gigi. Jangan terus berkumur dengan air."],
2:["Ubat gigi berfluorida membantu menguatkan gigi dan mencegah karies gigi.","Jangan telan ubat gigi. Ludah selepas memberus.","Kanak-kanak kecil perlu diselia oleh orang dewasa semasa memberus.","!Kepekatan fluorida dan kuantiti mengikut umur: menunggu semakan klinikal berdasarkan garis panduan Kementerian Kesihatan semasa."],
3:["Berus gigi tidak sampai ke celah gigi. Membersihkan celah gigi sekali sehari membantu melindungi gusi.","Flos: luncurkan perlahan di antara gigi, lengkungkan seperti huruf C pada setiap gigi dan gerakkan ke atas dan ke bawah.","Berus interdental mungkin sesuai untuk celah yang lebih besar, pemakai pendakap atau masalah gusi. Dapatkan saiz yang betul daripada pasukan pergigian anda.","Pemakai pendakap boleh menggunakan penyulam flos atau berus interdental."]},
zh:{0:["每天刷牙两次，每次约2分钟。","让刷毛稍微朝牙龈线倾斜，用短而轻柔的动作刷（改良巴氏刷牙法，适合较大儿童和成人）。","幼儿：用小圆圈动作（Fones刷牙法），由家长协助。","刷净每颗牙齿的外侧、内侧和咬合面，包括牙龈线处。","刷牙后吐出牙膏，不要立刻用清水漱口。"],
2:["含氟牙膏有助于强化牙齿，预防蛀牙。","不要吞咽牙膏，刷牙后请吐出。","幼儿刷牙时需要成人监督。","!各年龄段的氟浓度和用量：有待对照卫生部最新指南进行临床审核。"],
3:["牙刷刷不到牙缝。每天清洁一次牙缝有助于保护牙龈。","牙线：轻轻滑入牙缝，在每颗牙齿周围弯成C形，上下移动。","牙缝较大、戴牙套或有牙龈问题的人可能适合使用牙缝刷，请向牙科人员咨询合适尺寸。","戴牙套者可使用穿线器或牙缝刷。"]}};
var X={en:{wt:"Why does this matter?",pt:"How much toothpaste?",ages:["Under 3 years","Rice-grain smear","3 years and above","Pea-sized"],dr:"DRAFT · pending verification against current MOH Malaysia guidance",ppm:"Check the tube: choose a fluoride toothpaste with at least 1000 ppm fluoride.",sup:"Parents: put the toothpaste on the brush yourself and supervise brushing.",ang:"Tilt the bristles slightly towards the gumline",tip:"Tip: 4 areas × 30 seconds ≈ 2 minutes",spit:"Spit, don’t rinse",cs:"Curve the floss in a C around each tooth",mv:"Slide up and down gently, just under the gum edge",w:{0:["Plaque is a sticky film of bacteria that builds up on teeth every day.","Bacteria in plaque make acids that can cause tooth decay and inflamed gums.","Brushing removes plaque. Spitting out (not rinsing) leaves fluoride on your teeth to keep protecting them."],2:["Fluoride makes tooth enamel stronger and helps teeth resist acid attacks from plaque.","Young children often swallow toothpaste. Too much fluoride while permanent teeth are forming can cause white or brown marks (fluorosis), so small children use less.","The right amount balances protection and safety, so brush twice a day with the right amount."],3:["A toothbrush cannot reach the tight spaces between teeth.","Plaque left there can irritate gums and contribute to decay between teeth.","Cleaning between teeth once a day helps keep gums healthy."]}},
ms:{wt:"Mengapa ini penting?",pt:"Berapa banyak ubat gigi?",ages:["Bawah 3 tahun","Sebesar sebutir beras","3 tahun dan ke atas","Sebesar biji kacang pis"],dr:"DRAF · menunggu pengesahan berdasarkan garis panduan KKM Malaysia semasa",ppm:"Semak tiub: pilih ubat gigi berfluorida dengan sekurang-kurangnya 1000 ppm fluorida.",sup:"Ibu bapa: letakkan ubat gigi pada berus sendiri dan selia semasa memberus.",ang:"Condongkan bulu berus sedikit ke arah garis gusi",tip:"Petua: 4 kawasan × 30 saat ≈ 2 minit",spit:"Ludah, jangan berkumur",cs:"Lengkungkan flos seperti huruf C pada setiap gigi",mv:"Gerakkan perlahan ke atas dan ke bawah, tepat di bawah tepi gusi",w:{0:["Plak ialah lapisan melekit bakteria yang terkumpul pada gigi setiap hari.","Bakteria dalam plak menghasilkan asid yang boleh menyebabkan karies gigi dan gusi radang.","Memberus membuang plak. Meludah (bukan berkumur) meninggalkan fluorida pada gigi supaya terus melindunginya."],2:["Fluorida menguatkan enamel gigi dan membantu gigi menahan serangan asid daripada plak.","Kanak-kanak kecil sering menelan ubat gigi. Fluorida berlebihan semasa gigi kekal sedang terbentuk boleh menyebabkan tompok putih atau coklat (fluorosis), jadi kanak-kanak kecil menggunakan kuantiti yang lebih sedikit.","Kuantiti yang betul mengimbangi perlindungan dan keselamatan, jadi berus dua kali sehari dengan kuantiti yang betul."],3:["Berus gigi tidak dapat sampai ke ruang sempit di antara gigi.","Plak yang tertinggal di situ boleh merengsa gusi dan menyumbang kepada karies di celah gigi.","Membersihkan celah gigi sekali sehari membantu memastikan gusi sihat."]}},
zh:{wt:"这为什么重要？",pt:"牙膏要用多少？",ages:["3岁以下","米粒大小","3岁及以上","豌豆大小"],dr:"草稿 · 有待对照马来西亚卫生部最新指南核实",ppm:"查看牙膏包装：选择含氟量至少1000 ppm的含氟牙膏。",sup:"家长：请自己把牙膏挤在牙刷上，并监督刷牙。",ang:"刷毛稍微朝牙龈线倾斜",tip:"小贴士：4个区域 × 30秒 ≈ 2分钟",spit:"吐出，不要漱口",cs:"把牙线在每颗牙周围弯成C形",mv:"轻轻上下滑动，到牙龈边缘下方一点",w:{0:["牙菌斑是每天在牙齿上积聚的一层黏性细菌膜。","牙菌斑中的细菌会产生酸，可能导致蛀牙和牙龈发炎。","刷牙可清除牙菌斑。吐出而不漱口，可让氟留在牙齿上继续保护牙齿。"],2:["氟能强化牙釉质，帮助牙齿抵抗牙菌斑产生的酸。","幼儿常会吞下牙膏。恒牙形成期间摄入过多氟，可能出现白色或褐色斑点（氟斑牙），所以幼儿用量要少。","用量适当才能兼顾保护与安全，所以每天刷牙两次并用对分量。"],3:["牙刷无法刷到牙齿之间的狭窄空隙。","残留在那里的牙菌斑会刺激牙龈，也可能导致牙缝蛀牙。","每天清洁一次牙缝，有助于保持牙龈健康。"]}}};

en:[["How often should you brush your teeth?",["Once a week","Twice a day","Only when they hurt"],"Brushing twice a day removes plaque and helps protect teeth and gums."],["Why is fluoride toothpaste important?",["It whitens teeth instantly","It replaces flossing","It helps prevent tooth decay"],"Fluoride strengthens tooth enamel and helps prevent decay."],["Which toothbrush bristles are recommended?",["Soft","Hard","It does not matter"],"Soft bristles clean well and are gentler on gums."],["How often should you clean between your teeth?",["Once a day","Never needed","Only when it hurts"],"Cleaning between teeth once a day reaches areas a toothbrush cannot."],["What helps prevent tooth decay?",["Rinsing with water only","Skipping dental visits","Fluoride toothpaste twice a day and fewer sugary snacks"],"Fluoride and less frequent sugar together help prevent decay."]],
ms:[["Berapa kerap anda perlu memberus gigi?",["Seminggu sekali","Dua kali sehari","Hanya apabila sakit"],"Memberus dua kali sehari membuang plak dan melindungi gigi serta gusi."],["Mengapa ubat gigi berfluorida penting?",["Memutihkan gigi serta-merta","Menggantikan flos","Membantu mencegah karies gigi"],"Fluorida menguatkan enamel gigi dan membantu mencegah karies."],["Bulu berus gigi manakah yang disyorkan?",["Lembut","Keras","Tidak mengapa"],"Bulu lembut membersihkan dengan baik dan lebih lembut pada gusi."],["Berapa kerap anda perlu membersihkan celah gigi?",["Sekali sehari","Tidak perlu","Hanya apabila sakit"],"Membersihkan celah gigi sekali sehari mencapai kawasan yang tidak dapat dicapai berus gigi."],["Apakah yang membantu mencegah karies gigi?",["Berkumur dengan air sahaja","Tidak ke klinik pergigian","Ubat gigi berfluorida dua kali sehari dan kurangkan makanan bergula"],"Fluorida dan pengambilan gula yang kurang kerap bersama-sama membantu mencegah karies."]],

en:{n:['Special Needs (including OKU)','Infants & Toddlers','Braces & Aligners','Dentures'],i:'Some people need extra or adapted oral care. Choose a group below to learn more.',m:[['Let the person brush as independently as they can, then a caregiver finishes the job.','Sit the person comfortably with the head supported. A thicker or adapted handle, or an electric brush, can help if grip is weak.','Keep a calm daily routine at the same time each day, using simple steps, pictures and praise.','Tell the dental team about medicines, health conditions and what helps the person feel at ease.','!If there is difficulty swallowing or a choking risk, ask the dental team about the safest toothpaste amount and brushing position.'],['Before teeth appear, gently wipe the gums with a clean, damp cloth. When the first tooth appears, start brushing it twice a day with a soft, baby-sized brush.','Do not let your baby fall asleep with a bottle of milk or a sweet drink. Move to a cup as advised by your health team.','Do not share spoons or clean a pacifier with your mouth. This can pass germs to your baby.','Bring your baby for a dental visit as soon as teeth appear. Your dental team will advise the best timing.','!Fluoride toothpaste amount and timing of the first dental visit for infants: pending clinical review against current MOH Malaysia guidance.'],['Braces: brush after meals when you can and at least twice a day, cleaning around every bracket, wire and along the gumline.','Use an interdental brush or floss threader to clean around wires and between teeth.','Avoid hard, sticky and sugary foods that can break braces or trap plaque.','Aligners: take them out to eat and drink anything except water. Brush your teeth before putting them back in.','Clean aligners with a soft brush and cool water, wear them as long as your orthodontic team advises, and contact the team if anything breaks.'],['Clean dentures every day with a soft brush and mild soap or denture cleaner. Ordinary toothpaste can scratch them.','Clean them over a basin of water or a folded towel so they do not break if dropped.','Brush your gums, tongue and any natural teeth every day with a soft toothbrush.','Take dentures out at night as advised and keep them in water or cleaning solution, away from children and pets.','See your dentist if a denture is loose, cracked or causes sore spots. Do not fix it with glue at home.','!Overnight denture care and cleaner type: confirm with the treating dentist, as advice can differ for each patient.']],w:[['Some people find it hard to clean their mouth, or have conditions or medicines that raise the risk of dental problems.','A steady, calm routine makes brushing easier and less stressful over time.','Regular visits help the dental team plan care that suits the person.'],['Baby teeth help with chewing, speaking and saving space for adult teeth.','Decay can start soon after teeth appear.','Milk or sweet drinks around the teeth during sleep keep sugar on them for a long time.'],['Braces and wires trap plaque, and plaque left around brackets can leave white marks on teeth.','Aligners can hold food and sugary drinks against teeth if worn while eating or drinking.','Healthy gums and clean teeth help treatment go smoothly.'],['Plaque and germs build up on dentures just like natural teeth and can cause bad breath and sore, red gums.','Taking dentures out at night lets the gums rest.','Hot water can warp dentures, and damaged dentures can hurt the mouth.']]},
ms:{n:['Keperluan Khas (termasuk OKU)','Bayi dan Kanak-kanak Kecil','Pendakap dan Aligner','Gigi Palsu'],i:'Sesetengah orang memerlukan penjagaan mulut tambahan atau disesuaikan. Pilih kumpulan di bawah untuk ketahui lebih lanjut.',m:[['Biarkan individu memberus sendiri sebanyak yang mampu, kemudian penjaga menyempurnakannya.','Dudukkan individu dengan selesa dan sokong kepalanya. Pemegang yang lebih tebal atau diubah suai, atau berus elektrik, boleh membantu jika genggaman lemah.','Kekalkan rutin harian yang tenang pada waktu yang sama setiap hari, dengan langkah mudah, gambar dan pujian.','Maklumkan kepada pasukan pergigian tentang ubat-ubatan, keadaan kesihatan dan perkara yang menenangkan individu.','!Jika sukar menelan atau berisiko tercekik, dapatkan nasihat pasukan pergigian tentang kuantiti ubat gigi dan posisi memberus yang paling selamat.'],['Sebelum gigi tumbuh, lap gusi perlahan-lahan dengan kain bersih yang lembap. Apabila gigi pertama tumbuh, mula memberusnya dua kali sehari dengan berus lembut bersaiz bayi.','Jangan biarkan bayi tidur dengan botol susu atau minuman manis. Beralih kepada cawan seperti dinasihatkan oleh pasukan kesihatan anda.','Jangan berkongsi sudu atau membersihkan puting tiruan dengan mulut. Ini boleh memindahkan kuman kepada bayi.','Bawa bayi anda berjumpa pasukan pergigian sebaik sahaja gigi tumbuh. Pasukan pergigian akan menasihati masa yang terbaik.','!Kuantiti ubat gigi berfluorida dan masa lawatan pergigian pertama untuk bayi: menunggu semakan klinikal berdasarkan garis panduan KKM Malaysia semasa.'],['Pendakap: memberus selepas makan jika boleh dan sekurang-kurangnya dua kali sehari, bersihkan sekeliling setiap braket, wayar dan di sepanjang garis gusi.','Gunakan berus interdental atau penyulam flos untuk membersihkan sekeliling wayar dan celah gigi.','Elakkan makanan keras, melekit dan bergula yang boleh merosakkan pendakap atau memerangkap plak.','Aligner: tanggalkan semasa makan dan minum apa-apa selain air. Berus gigi sebelum memakainya semula.','Bersihkan aligner dengan berus lembut dan air sejuk, pakai selama yang dinasihatkan pasukan ortodontik anda, dan hubungi pasukan jika ada kerosakan.'],['Bersihkan gigi palsu setiap hari dengan berus lembut dan sabun lembut atau pembersih gigi palsu. Ubat gigi biasa boleh menggaruinya.','Bersihkan di atas besen berisi air atau tuala berlipat supaya tidak patah jika terjatuh.','Berus gusi, lidah dan gigi asli (jika ada) setiap hari dengan berus gigi lembut.','Tanggalkan gigi palsu pada waktu malam seperti dinasihatkan dan simpan dalam air atau larutan pembersih, jauh daripada kanak-kanak dan haiwan peliharaan.','Berjumpa doktor gigi jika gigi palsu longgar, retak atau menyebabkan luka. Jangan membaikinya dengan gam di rumah.','!Penjagaan gigi palsu pada waktu malam dan jenis pembersih: sahkan dengan doktor gigi yang merawat, kerana nasihat boleh berbeza bagi setiap pesakit.']],w:[['Sesetengah orang sukar membersihkan mulut, atau mempunyai keadaan kesihatan atau ubat yang meningkatkan risiko masalah gigi.','Rutin yang tetap dan tenang menjadikan memberus lebih mudah dan kurang tertekan dari semasa ke semasa.','Lawatan berkala membantu pasukan pergigian merancang penjagaan yang sesuai.'],['Gigi susu membantu mengunyah, bercakap dan menyimpan ruang untuk gigi dewasa.','Karies boleh bermula sejurus selepas gigi tumbuh.','Susu atau minuman manis di sekeliling gigi semasa tidur mengekalkan gula pada gigi untuk masa yang lama.'],['Pendakap dan wayar memerangkap plak, dan plak yang tertinggal di sekeliling braket boleh meninggalkan tanda putih pada gigi.','Aligner boleh menahan makanan dan minuman manis pada gigi jika dipakai semasa makan atau minum.','Gusi yang sihat dan gigi yang bersih membantu rawatan berjalan lancar.'],['Plak dan kuman terkumpul pada gigi palsu sama seperti gigi asli dan boleh menyebabkan nafas berbau serta gusi merah yang sakit.','Menanggalkan gigi palsu pada waktu malam membolehkan gusi berehat.','Air panas boleh meleding gigi palsu, dan gigi palsu yang rosak boleh mencederakan mulut.']]},
zh:{n:['特殊需要（包括OKU）','婴幼儿','牙套与隐形矫治器','假牙'],i:'有些人需要额外或经过调整的口腔护理。请选择下方类别了解更多。',m:[['让对方尽量自己刷牙，再由照护者完成剩余部分。','让对方舒适坐好并托住头部。若握力较弱，可使用较粗或经改装的牙刷柄，或电动牙刷。','每天在相同时间保持平静的刷牙流程，用简单步骤、图片和称赞来配合。','告知牙科团队对方正在服用的药物、健康状况，以及什么能让对方放松。','!若有吞咽困难或呛噎风险，请向牙科团队咨询最安全的牙膏用量和刷牙姿势。'],['牙齿长出之前，用干净湿润的布轻轻擦拭牙龈。第一颗牙长出后，每天用柔软的婴儿牙刷刷两次。','不要让宝宝含着奶瓶或甜饮料入睡。请按照医护团队的建议改用杯子。','不要共用汤匙，也不要用嘴清洁安抚奶嘴，这样会把细菌传给宝宝。','牙齿一长出来就带宝宝看牙科，牙科团队会建议最合适的时间。','!婴儿含氟牙膏用量与首次看牙时间：有待对照马来西亚卫生部最新指南进行临床审核。'],['牙套：尽可能在饭后刷牙，每天至少两次，清洁每个托槽、钢丝周围以及牙龈线。','用牙缝刷或穿线器清洁钢丝周围和牙缝。','避免会弄坏牙套或积聚牙菌斑的硬、黏、甜食物。','隐形矫治器：除了喝水，吃东西和喝饮料时要取下，戴回前先刷牙。','用软毛刷和冷水清洁矫治器，按矫治团队的建议佩戴时间，若有损坏请联系团队。'],['每天用软毛刷和温和肥皂或假牙清洁剂清洁假牙，普通牙膏可能刮伤假牙。','在装水的脸盆或折好的毛巾上方清洁，掉落时才不会摔坏。','每天用软毛牙刷刷牙龈、舌头和剩余的天然牙。','按建议在晚上取下假牙，浸泡在清水或清洁液中，放在儿童和宠物够不到的地方。','假牙松动、裂开或造成溃疡时请看牙医，不要在家用胶水修补。','!假牙夜间护理方式与清洁剂种类：请向主治牙医确认，因为每位患者的建议可能不同。']],w:[['有些人难以清洁口腔，或因健康状况、药物而增加牙齿问题的风险。','稳定平静的流程，能让刷牙越来越容易、压力更小。','定期就诊有助于牙科团队制定合适的护理计划。'],['乳牙有助于咀嚼、说话，也为恒牙留出位置。','牙齿长出不久就可能蛀牙。','睡觉时牙齿接触牛奶或甜饮料，糖分会长时间留在牙齿上。'],['牙套和钢丝容易积聚牙菌斑，托槽周围残留的牙菌斑可能在牙齿上留下白斑。','如果吃喝时仍戴着矫治器，食物和含糖饮料会贴在牙齿上。','健康的牙龈和干净的牙齿有助于矫治顺利进行。'],['假牙和天然牙一样会积聚牙菌斑和细菌，可能造成口臭以及牙龈红肿疼痛。','晚上取下假牙能让牙龈休息。','热水可能使假牙变形，受损的假牙会伤到口腔。']]}};

en:{m:{1:['Choose a soft-bristled brush. Hard bristles can wear away gums and tooth surfaces.','A small brush head reaches the back teeth more easily. The handle should feel comfortable to hold.','Manual and electric brushes can both clean well when used properly. An electric brush may help people who find manual brushing difficult.','Replace your toothbrush about every 3 months, or sooner if the bristles are bent or frayed, and after an illness.','Brush gently. Pressing hard does not clean better and can hurt your gums.'],5:['Start brushing as soon as the first tooth appears. Parents should brush young children’s teeth and supervise until the child can brush well.','Use fluoride toothpaste in the amount suited to your child’s age (see the toothpaste module). Help your child spit it out.','Limit sugary drinks and snacks. Offer water and keep sweet foods to mealtimes where possible.','Do not let your child sleep with a bottle of milk or a sweet drink.','Baby teeth matter: they help with chewing and speech and guide adult teeth into place. Decay in baby teeth can cause pain and infection.','Visit the dental clinic regularly for check-ups and preventive care, even when there is no pain.','!Age for independent brushing and recommended visit interval for children: confirm against current MOH Malaysia guidance.'],6:['Brush twice a day with fluoride toothpaste and clean between your teeth once a day.','Limit how often you have sugary foods and drinks, especially between meals.','Healthy gums do not usually bleed or hurt. Bleeding when you brush is a sign to clean more carefully, and to see a dental professional if it continues.','Smoking harms the gums and slows healing. Stopping helps your mouth and your whole body; ask your clinic about support.','Have regular dental check-ups so problems are found early.','!Recommended check-up interval for adults: confirm against current MOH Malaysia guidance.'],7:['Keep brushing twice a day with fluoride toothpaste, even if you have few teeth. Clean your gums and tongue too.','Dry mouth raises the risk of decay, including on exposed root surfaces. Sip water often, and ask your dentist or pharmacist if a medicine is causing it.','Denture wearers: see the Dentures module for daily cleaning and night-time care.','Caregivers: help with brushing and denture cleaning for people who cannot do it themselves, in a gentle and patient way.','Keep visiting the dentist regularly, even if you wear dentures.']},w:{1:['Soft bristles remove plaque without damaging gums.','Worn bristles clean less well.','Gentle, thorough brushing matters more than pressure.'],5:['Early cavities can start soon after teeth appear, and they can be prevented.','Children cannot brush well alone because their hand skills are still developing.','Frequent sugar means more acid attacks on teeth.'],6:['Most gum disease and decay can be prevented with daily habits.','Smoking raises the risk of gum disease and mouth cancer.','Early problems often cause no pain.'],7:['Gums can recede with age, exposing roots that decay more easily.','Many medicines reduce saliva, which normally protects teeth.','A clean mouth helps comfort and eating.']}},
ms:{m:{1:['Pilih berus bulu lembut. Bulu keras boleh menghakis gusi dan permukaan gigi.','Kepala berus yang kecil lebih mudah sampai ke gigi belakang. Pemegang hendaklah selesa dipegang.','Berus manual dan elektrik kedua-duanya boleh membersihkan dengan baik jika digunakan dengan betul. Berus elektrik mungkin membantu mereka yang sukar memberus secara manual.','Tukar berus gigi kira-kira setiap 3 bulan, atau lebih awal jika bulu bengkok atau mengembang, dan selepas sakit.','Berus dengan lembut. Menekan kuat tidak membersihkan lebih baik dan boleh mencederakan gusi.'],5:['Mula memberus sebaik sahaja gigi pertama tumbuh. Ibu bapa perlu memberus gigi anak kecil dan menyelia sehingga anak dapat memberus dengan baik.','Gunakan ubat gigi berfluorida mengikut kuantiti yang sesuai dengan umur anak (lihat modul ubat gigi). Bantu anak meludah.','Hadkan minuman dan snek bergula. Berikan air dan, jika boleh, hadkan makanan manis pada waktu makan.','Jangan biarkan anak tidur dengan botol susu atau minuman manis.','Gigi susu penting: ia membantu mengunyah, bercakap dan memandu gigi dewasa ke tempat yang betul. Karies pada gigi susu boleh menyebabkan sakit dan jangkitan.','Lawati klinik pergigian secara berkala untuk pemeriksaan dan penjagaan pencegahan, walaupun tiada sakit.','!Umur anak memberus sendiri dan jarak lawatan yang disyorkan untuk kanak-kanak: sahkan dengan garis panduan KKM Malaysia semasa.'],6:['Berus dua kali sehari dengan ubat gigi berfluorida dan bersihkan celah gigi sekali sehari.','Hadkan kekerapan makanan dan minuman bergula, terutamanya di antara waktu makan.','Gusi yang sihat biasanya tidak berdarah atau sakit. Gusi berdarah semasa memberus ialah tanda untuk membersihkan dengan lebih teliti dan berjumpa profesional pergigian jika berterusan.','Merokok merosakkan gusi dan melambatkan penyembuhan. Berhenti merokok membantu mulut dan seluruh badan; tanya klinik anda tentang sokongan.','Jalani pemeriksaan pergigian berkala supaya masalah dapat dikesan awal.','!Jarak pemeriksaan yang disyorkan untuk dewasa: sahkan dengan garis panduan KKM Malaysia semasa.'],7:['Terus memberus dua kali sehari dengan ubat gigi berfluorida, walaupun gigi tinggal sedikit. Bersihkan gusi dan lidah juga.','Mulut kering meningkatkan risiko karies, termasuk pada permukaan akar yang terdedah. Kerap hirup air, dan tanya doktor gigi atau ahli farmasi jika ubat menyebabkannya.','Pemakai gigi palsu: lihat modul Gigi Palsu untuk pembersihan harian dan penjagaan waktu malam.','Penjaga: bantu memberus dan membersihkan gigi palsu bagi mereka yang tidak mampu sendiri, dengan cara yang lembut dan sabar.','Teruskan berjumpa doktor gigi secara berkala, walaupun memakai gigi palsu.']},w:{1:['Bulu lembut membuang plak tanpa merosakkan gusi.','Bulu yang haus kurang berkesan membersihkan.','Memberus dengan lembut dan teliti lebih penting daripada tekanan.'],5:['Karies awal boleh bermula sejurus gigi tumbuh dan boleh dicegah.','Kanak-kanak tidak dapat memberus dengan baik sendiri kerana kemahiran tangan masih berkembang.','Gula yang kerap bermakna lebih banyak serangan asid pada gigi.'],6:['Kebanyakan penyakit gusi dan karies boleh dicegah dengan tabiat harian.','Merokok meningkatkan risiko penyakit gusi dan kanser mulut.','Masalah awal selalunya tidak menyebabkan sakit.'],7:['Gusi boleh surut apabila usia meningkat, mendedahkan akar yang lebih mudah mereput.','Banyak ubat mengurangkan air liur, yang biasanya melindungi gigi.','Mulut yang bersih membantu keselesaan dan pemakanan.']}},
zh:{m:{1:['选择软毛牙刷。硬毛可能磨损牙龈和牙齿表面。','小刷头更容易刷到后牙，刷柄应握着舒适。','手动和电动牙刷只要使用正确都能清洁得很好。刷牙有困难的人，电动牙刷可能更有帮助。','大约每3个月更换一次牙刷，若刷毛弯曲或散开，或生病之后，要更早更换。','轻柔刷牙。用力压并不会更干净，还可能伤到牙龈。'],5:['第一颗牙长出就开始刷牙。家长应帮幼儿刷牙并监督，直到孩子能刷得好为止。','按孩子的年龄使用适量的含氟牙膏（见牙膏模块），并帮助孩子吐出。','限制含糖饮料和零食。多给水喝，尽量把甜食放在正餐时间。','不要让孩子含着奶瓶或甜饮料入睡。','乳牙很重要：有助于咀嚼、说话，并引导恒牙长到正确位置。乳牙蛀牙可能引起疼痛和感染。','即使不痛，也要定期到牙科诊所检查和接受预防护理。','!孩子何时可自己刷牙及建议的就诊间隔：请对照马来西亚卫生部最新指南确认。'],6:['每天用含氟牙膏刷牙两次，每天清洁一次牙缝。','减少吃喝含糖食物的次数，尤其是两餐之间。','健康的牙龈通常不会出血或疼痛。刷牙时出血是要更仔细清洁的信号，若持续请看牙科专业人员。','吸烟会伤害牙龈并延缓愈合。戒烟对口腔和全身都有益，可向诊所询问戒烟支持。','定期做牙科检查，才能及早发现问题。','!成人建议的检查间隔：请对照马来西亚卫生部最新指南确认。'],7:['即使只剩少数牙齿，也要每天用含氟牙膏刷牙两次，同时清洁牙龈和舌头。','口干会增加蛀牙风险，包括外露的牙根面。要常喝水，若是药物引起，请询问牙医或药剂师。','戴假牙者：每日清洁和夜间护理请见“假牙”模块。','照护者：对无法自理的人，请温和耐心地协助刷牙和清洁假牙。','即使戴假牙，也要继续定期看牙医。']},w:{1:['软毛能清除牙菌斑又不伤牙龈。','磨损的刷毛清洁效果较差。','轻柔而彻底比用力更重要。'],5:['早期蛀牙在牙齿长出后不久就可能出现，而且可以预防。','孩子的手部技能仍在发展，自己刷不干净。','频繁吃糖意味着牙齿受到更多酸的攻击。'],6:['大多数牙龈疾病和蛀牙可通过日常习惯预防。','吸烟会增加牙龈疾病和口腔癌的风险。','早期问题往往没有疼痛。'],7:['牙龈会随年龄退缩，外露的牙根更容易蛀牙。','许多药物会减少唾液，而唾液通常能保护牙齿。','口腔清洁有助于舒适和进食。']}}};

en:{n:['Pregnant Women','Dry Mouth','Tooth Sensitivity'],m:{4:['These are summaries for general information. Only a dental professional can tell what is causing your symptoms.','<b>Dental caries (tooth decay):</b> damage to teeth caused by acids from plaque bacteria and sugars. It may show as white or brown spots, holes or toothache. Prevent it with fluoride toothpaste, fewer sugary snacks and regular check-ups.','<b>Gingivitis:</b> inflamed gums caused by plaque. Gums may look red or swollen and bleed when brushing. It can often be reversed with good brushing and cleaning between teeth.','<b>Periodontitis:</b> a more serious gum disease that damages the tissues and bone holding teeth. Signs may include gums pulling away, bad breath that does not go away, and loose teeth. It needs professional care.','<b>Halitosis (bad breath):</b> often comes from plaque and bacteria on the teeth, gums and tongue. Brush, clean between teeth and gently clean your tongue. Persistent bad breath should be checked by a dental professional.','<b>Tooth sensitivity:</b> short, sharp pain with cold, hot, sweet or touch, which can happen when dentine is exposed. Brush gently with a soft brush. See a dentist if it lasts or is severe, as there are several possible causes.','<b>Seek dental care promptly if</b> you have toothache, swelling of the face or gums, gums that bleed often, loose teeth, a mouth ulcer that does not heal in about 3 weeks, or pain that does not settle.'],13:['Brush twice a day with fluoride toothpaste and clean between your teeth daily. Hormone changes can make gums more likely to swell and bleed.','If morning sickness makes you vomit, rinse your mouth with plain water afterwards and wait a while before brushing, because stomach acid softens the tooth surface.','Eat regular healthy meals and limit sugary snacks.','Dental check-ups and care during pregnancy are important. Tell the dental team that you are pregnant.','!Timing of dental treatment and any medicines during pregnancy: the dentist will advise; confirm against current MOH Malaysia guidance.'],14:['Dry mouth happens when there is not enough saliva. Common causes include some medicines, certain health conditions and mouth breathing.','Sip water often and have water with meals. Sugar-free gum or lozenges may help the mouth make more saliva.','Avoid sugary drinks and snacks, tobacco, and alcohol-containing mouthwash, which can make dryness worse.','Use fluoride toothpaste and keep up careful brushing, because teeth are more likely to decay when the mouth is dry.','See your dentist or doctor if dryness continues. Do not stop medicines without medical advice.'],15:['Tooth sensitivity is a short, sharp pain from cold, hot, sweet or touch. It may happen when the softer layer under the enamel is exposed.','Brush gently with a soft brush. Hard brushing can wear away gums and enamel and make sensitivity worse.','Toothpaste made for sensitive teeth may help when used regularly. Ask your dental team which one is suitable.','Limit acidic drinks and foods such as fizzy drinks and citrus, and do not brush straight after acidic foods.','See a dentist if the pain is strong, lasts a long time or wakes you at night, because a cavity or crack can cause similar pain. Do not self-diagnose.']},w:{4:['Many dental problems start quietly, without pain.','Early care is simpler, cheaper and gentler than treating advanced problems.','Self-diagnosis can be wrong, because one symptom can have several causes.'],13:['Hormone changes can make gums react more strongly to plaque.','Stomach acid from vomiting can weaken enamel.','Good oral care now also helps you start healthy habits for your baby.'],14:['Saliva washes away food, neutralises acids and protects teeth.','Less saliva means more decay, gum problems and mouth discomfort.','Small daily habits can ease dryness.'],15:['Exposed dentine has tiny channels that lead to the tooth’s nerve.','Gentle brushing and the right toothpaste can reduce the discomfort.','Persistent pain needs a dental check, as several problems feel the same.']}},
ms:{n:['Wanita Mengandung','Mulut Kering','Kepekaan Gigi'],m:{4:['Ini ringkasan untuk maklumat umum. Hanya profesional pergigian yang dapat memastikan punca simptom anda.','<b>Karies gigi (reput gigi):</b> kerosakan gigi yang disebabkan oleh asid daripada bakteria plak dan gula. Ia boleh kelihatan sebagai tompok putih atau coklat, lubang atau sakit gigi. Cegah dengan ubat gigi berfluorida, kurangkan snek bergula dan pemeriksaan berkala.','<b>Gingivitis:</b> gusi radang akibat plak. Gusi mungkin kelihatan merah atau bengkak dan berdarah semasa memberus. Ia selalunya boleh dipulihkan dengan memberus dengan baik dan membersihkan celah gigi.','<b>Periodontitis:</b> penyakit gusi yang lebih serius dan merosakkan tisu serta tulang yang menampung gigi. Tandanya mungkin gusi surut, nafas berbau yang tidak hilang dan gigi bergoyang. Ia memerlukan rawatan profesional.','<b>Halitosis (nafas berbau):</b> selalunya datang daripada plak dan bakteria pada gigi, gusi dan lidah. Berus gigi, bersihkan celah gigi dan bersihkan lidah dengan lembut. Bau mulut yang berterusan perlu diperiksa oleh profesional pergigian.','<b>Kepekaan gigi:</b> sakit singkat dan tajam apabila terkena sejuk, panas, manis atau sentuhan, yang boleh berlaku apabila dentin terdedah. Berus dengan lembut menggunakan berus lembut. Berjumpa doktor gigi jika berpanjangan atau teruk, kerana terdapat beberapa kemungkinan punca.','<b>Dapatkan rawatan pergigian segera jika</b> anda mengalami sakit gigi, bengkak pada muka atau gusi, gusi kerap berdarah, gigi bergoyang, ulser mulut yang tidak sembuh dalam kira-kira 3 minggu, atau sakit yang tidak reda.'],13:['Berus dua kali sehari dengan ubat gigi berfluorida dan bersihkan celah gigi setiap hari. Perubahan hormon boleh menjadikan gusi lebih mudah bengkak dan berdarah.','Jika mual pagi menyebabkan muntah, kumurkan mulut dengan air kosong selepas itu dan tunggu seketika sebelum memberus, kerana asid perut melembutkan permukaan gigi.','Makan hidangan sihat secara teratur dan hadkan snek bergula.','Pemeriksaan dan penjagaan pergigian semasa mengandung adalah penting. Beritahu pasukan pergigian bahawa anda mengandung.','!Masa rawatan pergigian dan sebarang ubat semasa mengandung: doktor gigi akan menasihati; sahkan dengan garis panduan KKM Malaysia semasa.'],14:['Mulut kering berlaku apabila air liur tidak mencukupi. Punca biasa termasuk sesetengah ubat, keadaan kesihatan tertentu dan bernafas melalui mulut.','Hirup air dengan kerap dan minum air semasa makan. Gula-gula getah atau gula-gula hisap tanpa gula boleh membantu mulut menghasilkan lebih banyak air liur.','Elakkan minuman dan snek bergula, tembakau serta ubat kumur beralkohol yang boleh menjadikan kekeringan lebih teruk.','Gunakan ubat gigi berfluorida dan teruskan memberus dengan teliti, kerana gigi lebih mudah reput apabila mulut kering.','Berjumpa doktor gigi atau doktor jika kekeringan berterusan. Jangan hentikan ubat tanpa nasihat perubatan.'],15:['Kepekaan gigi ialah sakit singkat dan tajam apabila terkena sejuk, panas, manis atau sentuhan. Ia boleh berlaku apabila lapisan lebih lembut di bawah enamel terdedah.','Berus dengan lembut menggunakan berus lembut. Memberus kuat boleh menghakis gusi dan enamel serta menjadikan kepekaan lebih teruk.','Ubat gigi untuk gigi sensitif mungkin membantu jika digunakan secara tetap. Tanya pasukan pergigian anda yang mana sesuai.','Hadkan minuman dan makanan berasid seperti minuman berkarbonat dan buah sitrus, dan jangan memberus sebaik sahaja makan makanan berasid.','Berjumpa doktor gigi jika sakit kuat, berpanjangan atau mengejutkan anda pada waktu malam, kerana lubang atau retak boleh menyebabkan sakit yang serupa. Jangan mendiagnosis sendiri.']},w:{4:['Banyak masalah pergigian bermula secara senyap, tanpa sakit.','Rawatan awal lebih mudah, lebih murah dan lebih lembut daripada merawat masalah yang sudah teruk.','Diagnosis sendiri boleh tersasar kerana satu simptom boleh mempunyai beberapa punca.'],13:['Perubahan hormon boleh menjadikan gusi bertindak balas lebih kuat terhadap plak.','Asid perut daripada muntah boleh melemahkan enamel.','Penjagaan mulut yang baik sekarang juga membantu anda memulakan tabiat sihat untuk bayi.'],14:['Air liur membasuh sisa makanan, meneutralkan asid dan melindungi gigi.','Air liur yang kurang bermakna lebih banyak karies, masalah gusi dan ketidakselesaan mulut.','Tabiat harian yang kecil boleh meredakan kekeringan.'],15:['Dentin yang terdedah mempunyai saluran halus yang menuju ke saraf gigi.','Memberus dengan lembut dan ubat gigi yang betul boleh mengurangkan ketidakselesaan.','Sakit yang berterusan perlu diperiksa kerana beberapa masalah terasa sama.']}},
zh:{n:['孕妇','口干','牙齿敏感'],m:{4:['以下为一般信息摘要。只有牙科专业人员才能判断症状的原因。','<b>龋齿（蛀牙）：</b>牙菌斑细菌和糖产生的酸损伤牙齿，可能表现为白色或褐色斑点、牙洞或牙痛。可用含氟牙膏、减少甜食零食和定期检查来预防。','<b>牙龈炎：</b>由牙菌斑引起的牙龈发炎，牙龈可能发红、肿胀，刷牙时出血。良好的刷牙和牙缝清洁通常能使其逆转。','<b>牙周炎：</b>较严重的牙龈疾病，会破坏支撑牙齿的组织和骨头。可能出现牙龈退缩、持续口臭和牙齿松动，需要专业治疗。','<b>口臭：</b>常来自牙齿、牙龈和舌头上的牙菌斑和细菌。请刷牙、清洁牙缝并轻轻清洁舌头。持续口臭应由牙科专业人员检查。','<b>牙齿敏感：</b>遇冷、热、甜或触碰时出现短暂尖锐的疼痛，可能在牙本质外露时发生。请用软毛刷轻柔刷牙。若持续或严重，请看牙医，因为可能有多种原因。','<b>出现以下情况请尽快看牙医：</b>牙痛、脸部或牙龈肿胀、牙龈经常出血、牙齿松动、口腔溃疡约3周仍未愈合，或疼痛不缓解。'],13:['每天用含氟牙膏刷牙两次，并每天清洁牙缝。激素变化会使牙龈更容易肿胀和出血。','若孕吐呕吐，之后请用清水漱口，并稍等一会儿再刷牙，因为胃酸会使牙齿表面变软。','规律吃健康的饭菜，并减少甜食零食。','怀孕期间的牙科检查和护理很重要。请告知牙科团队您已怀孕。','!怀孕期间牙科治疗的时机和用药：牙医会给出建议，请对照马来西亚卫生部最新指南确认。'],14:['口干是唾液不足所致。常见原因包括某些药物、某些健康状况和用嘴呼吸。','经常小口喝水，进餐时也喝水。无糖口香糖或含片可能有助于增加唾液。','避免含糖饮料和零食、烟草以及含酒精的漱口水，它们可能使口干加重。','使用含氟牙膏并认真刷牙，因为口腔干燥时牙齿更容易蛀。','若口干持续，请看牙医或医生。没有医嘱不要自行停药。'],15:['牙齿敏感是遇冷、热、甜或触碰时出现的短暂尖锐疼痛，可能在牙釉质下较软的一层外露时发生。','用软毛刷轻柔刷牙。用力刷会磨损牙龈和牙釉质，使敏感加重。','抗敏感牙膏若长期规律使用可能有帮助，请向牙科团队询问哪种合适。','减少碳酸饮料和柑橘类等酸性饮食，吃完酸性食物后不要立刻刷牙。','若疼痛强烈、持续很久或夜间痛醒，请看牙医，因为蛀洞或裂缝也可能引起类似疼痛。请勿自我诊断。']},w:{4:['许多牙齿问题悄悄开始，没有疼痛。','及早处理比治疗严重问题更简单、更省钱、更温和。','自我诊断可能出错，同一症状可能有多种原因。'],13:['激素变化会使牙龈对牙菌斑反应更强烈。','呕吐产生的胃酸会削弱牙釉质。','现在做好口腔护理，也有助于为宝宝培养健康习惯。'],14:['唾液能冲走食物残渣、中和酸并保护牙齿。','唾液减少意味着更多蛀牙、牙龈问题和口腔不适。','日常的小习惯可以缓解口干。'],15:['外露的牙本质有通向牙神经的细微通道。','轻柔刷牙和合适的牙膏可减轻不适。','持续疼痛需要检查，因为多种问题的感觉相似。']}}};

zh:{ti:'口腔卫生指导',tg:'为人生各阶段的牙齿和牙龈健康提供实用指导。',nt:'请选择类别，了解如何护理口腔。本资料仅供一般健康教育，不能取代专业牙科建议。',a:['A. 按年龄组的口腔卫生指导','适用于婴幼儿、儿童、成人和老年人。'],b:['B. 特殊口腔护理','适用于孕期、戴牙套、戴假牙、口干及特殊需要人士。'],c:['口腔卫生基础','刷牙、选择牙刷和牙膏、牙线及常见牙齿问题。'],d:['刷牙技巧','五种刷牙法，附简易步骤和动画演示。'],nv:['年龄组','特殊护理','基础','刷牙技巧'],gd:'指南',who:'适合谁？',sim:'简单说明',how:'做法',mis:'常见错误',dem:'动画演示（示意图）',ds:'牙医会建议适合您的刷牙方法。',adv:'如果您对口腔健康有任何疑问或担忧，请咨询牙医或前往附近的牙科诊所寻求专业建议。'}};

en:[['Modified Bass Technique','Most older children, teenagers and adults.','Cleans along the gum line, where plaque collects.',['Place your toothbrush gently where your teeth meet your gums.','Tilt the bristles slightly towards the gums.','Move the brush gently in small, short movements for a few seconds.','Sweep the brush towards the chewing surface of the tooth, then move to the next tooth.'],'Scrubbing hard from side to side.'],['Bass Technique','People with gum problems, when your dentist advises.','Cleans just under the gum edge with very small movements.',['Place the brush where the teeth meet the gums, with the bristles tilted towards the gums.','Move the brush in very small, gentle shaking movements without sliding it along the teeth.','Move to the next small group of teeth and repeat.'],'Pressing too hard, which can hurt the gums.'],['Fones Technique','Young children, with a parent’s help.','A large circular movement that is easy for small hands.',['Ask the child to close their teeth gently together.','Move the brush in large circles over the outer surfaces of the upper and lower teeth.','Open the mouth and brush the inner and chewing surfaces with back-and-forth movements.'],'Letting a young child brush alone without a parent finishing the job.'],['Stillman’s Technique','People with sensitive or receding gums, when your dentist advises.','Gently cleans the gum line and the necks of the teeth.',['Place the bristles at the gum line, tilted slightly towards the gums, with part of the bristles on the gum and part on the tooth.','Move the brush in tiny, gentle shaking movements.','Then sweep the brush towards the chewing surface of the tooth.'],'Pressing firmly on the gums.'],['Charter’s Technique','People with braces, gaps between teeth or after gum treatment, when your dentist advises.','Helps clean between the teeth and around appliances.',['Tilt the bristles towards the chewing surface, away from the gums, so the tips reach into the gaps between the teeth.','Move the brush in small, gentle circles or shaking movements.','Also clean along the gum line, using the technique your dentist recommends.'],'Forgetting to brush along the gum line.']],
ms:[['Teknik Bass Terubah Suai','Kebanyakan kanak-kanak yang lebih besar, remaja dan dewasa.','Membersihkan sepanjang garis gusi, tempat plak terkumpul.',['Letakkan berus gigi dengan lembut di tempat gigi bertemu gusi.','Condongkan bulu berus sedikit ke arah gusi.','Gerakkan berus dengan lembut dalam gerakan pendek dan kecil selama beberapa saat.','Sapukan berus ke arah permukaan kunyahan gigi, kemudian beralih ke gigi seterusnya.'],'Menggosok dengan kuat dari sisi ke sisi.'],['Teknik Bass','Orang yang mempunyai masalah gusi, apabila dinasihatkan oleh doktor pergigian.','Membersihkan tepat di bawah tepi gusi dengan gerakan yang sangat kecil.',['Letakkan berus di tempat gigi bertemu gusi, dengan bulu condong ke arah gusi.','Gerakkan berus dengan getaran kecil yang lembut tanpa menggelongsorkannya di sepanjang gigi.','Beralih ke kumpulan gigi kecil seterusnya dan ulang.'],'Menekan terlalu kuat sehingga boleh mencederakan gusi.'],['Teknik Fones','Kanak-kanak kecil, dengan bantuan ibu bapa.','Gerakan bulatan besar yang mudah untuk tangan kecil.',['Minta anak merapatkan gigi dengan lembut.','Gerakkan berus dalam bulatan besar pada permukaan luar gigi atas dan bawah.','Buka mulut dan berus permukaan dalam dan permukaan kunyahan dengan gerakan ke depan dan ke belakang.'],'Membiarkan kanak-kanak kecil memberus sendirian tanpa ibu bapa menyempurnakannya.'],['Teknik Stillman','Orang yang mempunyai gusi sensitif atau gusi surut, apabila dinasihatkan oleh doktor pergigian.','Membersihkan garis gusi dan leher gigi dengan lembut.',['Letakkan bulu berus pada garis gusi, condong sedikit ke arah gusi, dengan sebahagian bulu pada gusi dan sebahagian pada gigi.','Gerakkan berus dengan getaran yang kecil dan lembut.','Kemudian sapukan berus ke arah permukaan kunyahan gigi.'],'Menekan gusi dengan kuat.'],['Teknik Charter','Pemakai pendakap, orang yang mempunyai celah antara gigi atau selepas rawatan gusi, apabila dinasihatkan oleh doktor pergigian.','Membantu membersihkan celah gigi dan sekeliling alat.',['Condongkan bulu berus ke arah permukaan kunyahan, menjauhi gusi, supaya hujung bulu masuk ke celah antara gigi.','Gerakkan berus dalam bulatan kecil yang lembut atau getaran kecil.','Bersihkan garis gusi juga dengan teknik yang disyorkan oleh doktor pergigian anda.'],'Terlupa memberus di sepanjang garis gusi.']],
zh:[['改良巴氏刷牙法','大多数较大的儿童、青少年和成人。','清洁牙龈线处，那里最容易积聚牙菌斑。',['把牙刷轻轻放在牙齿与牙龈相接的地方。','让刷毛稍微朝向牙龈倾斜。','用短小轻柔的动作轻轻移动牙刷几秒钟。','再把牙刷朝牙齿的咬合面方向轻扫，然后移到下一颗牙齿。'],'用力左右来回擦刷。'],['巴氏刷牙法','有牙龈问题的人，需按牙医的建议使用。','用非常小的动作清洁牙龈边缘下方。',['把牙刷放在牙齿与牙龈相接处，刷毛朝牙龈倾斜。','用轻柔的小幅颤动来移动牙刷，不要沿着牙齿滑动。','移到下一小组牙齿，重复同样动作。'],'压得太用力，可能弄伤牙龈。'],['Fones 圆弧刷牙法','幼儿，需要家长协助。','大幅度的圆圈动作，小手也容易做到。',['请孩子轻轻咬合牙齿。','用牙刷在上下牙齿的外侧画大圆圈。','张开嘴，用来回动作刷牙齿的内侧和咬合面。'],'让幼儿自己刷牙而家长没有帮忙刷干净。'],['Stillman 刷牙法','牙龈敏感或牙龈退缩的人，需按牙医的建议使用。','轻柔地清洁牙龈线和牙颈部。',['把刷毛放在牙龈线处，稍微朝牙龈倾斜，一部分刷毛在牙龈上，一部分在牙齿上。','用轻柔的小幅颤动来移动牙刷。','然后把牙刷朝牙齿的咬合面方向轻扫。'],'对牙龈用力过大。'],['Charters 刷牙法','戴牙套、牙缝较大或牙龈治疗后的人，需按牙医的建议使用。','有助于清洁牙缝和矫治装置周围。',['让刷毛朝向咬合面、远离牙龈倾斜，使刷毛尖端伸入牙缝。','用轻柔的小圆圈或小幅颤动移动牙刷。','同时按牙医建议的方法清洁牙龈线。'],'忘记刷牙龈线。']]};

en:{at:'Oral Hygiene by Age Group',ad:'Six age groups, from infants to older adults, with brushing guidance for each.',st:'Special Oral Care',sd:'Pregnancy, braces, dentures, dry mouth and special needs.',gen:'General guides (all ages)',more:'More on this topic',dm:'Animated illustration',fg:'Pending verification against current MOH Malaysia guidance.',nm:['Infants and Toddlers (0–3 years)','Preschool Children (4–6 years)','School-Aged Children (7–12 years)','Teenagers (13–19 years)','Adults (20–59 years)','Elderly (60 years and above)'],q:['How often should I brush?','What type of toothbrush should I use?','How much toothpaste should I use?','How should I position my toothbrush?','What brushing movements should I make?','Which tooth surfaces should I clean?','How should I clean between my teeth?','Should I clean my tongue?','What common mistakes should I avoid?','When should I visit a dentist?'],d:['Brush twice a day, in the morning and before bed, for about two minutes.','Clean the outer, inner and chewing surfaces of every tooth, including the back teeth and along the gum line.','Yes. Gently brush or scrape the tongue to help keep your breath fresh.','Visit your dentist regularly for check-ups, and sooner if you have pain, bleeding gums, swelling or any change in your mouth.'],i:['Brush twice a day once the first tooth appears. Before that, gently wipe the gums with a clean, damp cloth.','Gently wipe the tongue with a clean, damp cloth.','Take your baby for a first dental visit as soon as teeth appear, and see the dentist regularly after that.'],s:[['A soft, small-headed baby toothbrush. Before teeth appear, use a clean, damp cloth.','A tiny smear of fluoride toothpaste, about the size of a rice grain. An adult applies it.','Hold your baby comfortably with the head supported, and gently lift the lip to see the teeth.','Use tiny, gentle circles or short back-and-forth movements. The parent or caregiver does the brushing.','Once teeth touch each other, ask your dental team how to clean between them.','Putting a baby to bed with a bottle of milk or a sweet drink.'],['A soft toothbrush with a small head and a thick handle that is easy to hold.','A pea-sized amount of fluoride toothpaste, put on the brush by a parent.','Place the brush against the teeth and gums. A parent helps to hold and guide it.','Use gentle circles over the outer surfaces (Fones technique), then back-and-forth movements on the inner and chewing surfaces.','A parent flosses where teeth touch, using a floss holder if needed.','Brushing alone without a parent finishing the job, and swallowing toothpaste.'],['A soft toothbrush with a small head that can reach the back molars.','A pea-sized amount of fluoride toothpaste. Spit it out and do not rinse straight away.','Tilt the bristles slightly towards the gums. Take extra care around the new permanent molars at the back.','Brush every surface in the same order each time so nothing is missed. Use small, gentle movements.','Start flossing once teeth touch, with a parent’s help at first.','Rushing, skipping the back molars and brushing too hard.'],['A soft toothbrush with a small head. Use an orthodontic toothbrush if you have braces.','A pea-sized amount of fluoride toothpaste.','Place the brush where your teeth meet your gums, with the bristles tilted slightly towards the gums.','Make small, gentle movements, then sweep the brush towards the chewing surface (Modified Bass approach).','Clean between your teeth daily with floss or interdental brushes, including around braces.','Brushing too hard, missing the gum line and frequent sugary drinks.'],['A soft toothbrush with a small head. A powered toothbrush is also suitable.','A pea-sized amount of fluoride toothpaste.','Place the brush where your teeth meet your gums, with the bristles tilted slightly towards the gums.','Use small, gentle movements with light pressure, then sweep towards the chewing surface (Modified Bass approach).','Clean between your teeth once a day with floss or interdental brushes.','Pressing too hard, rushing and missing the gum line.'],['A soft toothbrush. If your grip is weak, choose a thicker or adapted handle or a powered toothbrush.','A pea-sized amount of fluoride toothpaste.','Angle the bristles gently towards the gum line. If your hand shakes, rest your elbow on a table.','Use small, gentle movements with light pressure, especially where the gums have receded and roots are exposed.','Use interdental brushes or floss holders daily. Clean dentures as advised if you wear them.','Brushing too hard on exposed roots, and skipping brushing when tired.']]},
ms:{at:'Kebersihan Mulut Mengikut Kumpulan Umur',ad:'Enam kumpulan umur, daripada bayi hingga warga emas, dengan panduan memberus gigi bagi setiap kumpulan.',st:'Penjagaan Mulut Khas',sd:'Kehamilan, pendakap, gigi palsu, mulut kering dan keperluan khas.',gen:'Panduan am (semua peringkat umur)',more:'Lagi tentang topik ini',dm:'Ilustrasi animasi',fg:'Menunggu pengesahan berdasarkan garis panduan KKM Malaysia semasa.',nm:['Bayi dan Kanak-kanak Kecil (0–3 tahun)','Kanak-kanak Prasekolah (4–6 tahun)','Kanak-kanak Usia Persekolahan (7–12 tahun)','Remaja (13–19 tahun)','Dewasa (20–59 tahun)','Warga Emas (60 tahun dan ke atas)'],q:['Berapa kerap saya perlu memberus gigi?','Berus gigi jenis apakah yang perlu saya gunakan?','Berapa banyak ubat gigi yang perlu saya gunakan?','Bagaimanakah cara meletakkan berus gigi?','Apakah gerakan memberus yang betul?','Permukaan gigi manakah yang perlu dibersihkan?','Bagaimanakah cara membersihkan celah gigi?','Perlukah saya membersihkan lidah?','Apakah kesilapan biasa yang perlu dielakkan?','Bilakah saya perlu berjumpa doktor pergigian?'],d:['Berus gigi dua kali sehari, pada waktu pagi dan sebelum tidur, selama kira-kira dua minit.','Bersihkan permukaan luar, dalam dan permukaan kunyahan setiap gigi, termasuk gigi belakang dan di sepanjang garis gusi.','Ya. Berus atau kikis lidah dengan lembut untuk membantu mengekalkan kesegaran nafas.','Berjumpa doktor pergigian secara berkala untuk pemeriksaan, dan lebih awal jika anda mengalami sakit, gusi berdarah, bengkak atau sebarang perubahan pada mulut.'],i:['Berus gigi dua kali sehari apabila gigi pertama tumbuh. Sebelum itu, lap gusi dengan lembut menggunakan kain bersih yang lembap.','Lap lidah dengan lembut menggunakan kain bersih yang lembap.','Bawa bayi anda untuk lawatan pergigian pertama sebaik sahaja gigi tumbuh, dan berjumpa doktor pergigian secara berkala selepas itu.'],s:[['Berus gigi bayi yang lembut dan berkepala kecil. Sebelum gigi tumbuh, gunakan kain bersih yang lembap.','Calitan ubat gigi berfluorida yang sangat kecil, sebesar sebutir beras. Orang dewasa meletakkannya.','Pegang bayi dengan selesa dan sokong kepalanya, kemudian angkat bibir dengan lembut untuk melihat gigi.','Gunakan bulatan kecil yang lembut atau gerakan pendek ke depan dan ke belakang. Ibu bapa atau penjaga yang memberus.','Apabila gigi sudah bersentuhan, dapatkan nasihat pasukan pergigian tentang cara membersihkan celah gigi.','Membiarkan bayi tidur dengan botol susu atau minuman manis.'],['Berus gigi lembut berkepala kecil dengan pemegang tebal yang mudah dipegang.','Ubat gigi berfluorida sebesar biji kacang pis, diletakkan pada berus oleh ibu bapa.','Letakkan berus pada gigi dan gusi. Ibu bapa membantu memegang dan membimbing berus.','Gunakan bulatan lembut pada permukaan luar gigi (teknik Fones), kemudian gerakan ke depan dan ke belakang pada permukaan dalam dan permukaan kunyahan.','Ibu bapa mengflos di tempat gigi bersentuhan, menggunakan pemegang flos jika perlu.','Memberus sendirian tanpa ibu bapa menyempurnakannya, dan menelan ubat gigi.'],['Berus gigi lembut berkepala kecil yang dapat mencapai gigi geraham belakang.','Ubat gigi berfluorida sebesar biji kacang pis. Ludahkan dan jangan terus berkumur.','Condongkan bulu berus sedikit ke arah gusi. Beri perhatian khusus pada geraham kekal baharu di bahagian belakang.','Berus semua permukaan mengikut urutan yang sama setiap kali supaya tiada yang tertinggal. Gunakan gerakan kecil dan lembut.','Mula mengflos apabila gigi sudah bersentuhan, dengan bantuan ibu bapa pada mulanya.','Tergesa-gesa, tidak memberus geraham belakang dan memberus terlalu kuat.'],['Berus gigi lembut berkepala kecil. Gunakan berus gigi ortodontik jika anda memakai pendakap.','Ubat gigi berfluorida sebesar biji kacang pis.','Letakkan berus di tempat gigi bertemu gusi, dengan bulu condong sedikit ke arah gusi.','Buat gerakan kecil yang lembut, kemudian sapukan berus ke arah permukaan kunyahan (pendekatan Bass terubah suai).','Bersihkan celah gigi setiap hari dengan flos atau berus interdental, termasuk di sekeliling pendakap.','Memberus terlalu kuat, tidak memberus garis gusi dan kerap minum minuman bergula.'],['Berus gigi lembut berkepala kecil. Berus gigi berkuasa juga sesuai.','Ubat gigi berfluorida sebesar biji kacang pis.','Letakkan berus di tempat gigi bertemu gusi, dengan bulu condong sedikit ke arah gusi.','Gunakan gerakan kecil yang lembut dengan tekanan ringan, kemudian sapukan ke arah permukaan kunyahan (pendekatan Bass terubah suai).','Bersihkan celah gigi sekali sehari dengan flos atau berus interdental.','Menekan terlalu kuat, tergesa-gesa dan tidak memberus garis gusi.'],['Berus gigi lembut. Jika genggaman anda lemah, pilih pemegang yang lebih tebal atau diubah suai, atau berus gigi berkuasa.','Ubat gigi berfluorida sebesar biji kacang pis.','Condongkan bulu berus dengan lembut ke arah garis gusi. Jika tangan anda menggeletar, sandarkan siku pada meja.','Gunakan gerakan kecil yang lembut dengan tekanan ringan, terutamanya di tempat gusi telah surut dan akar terdedah.','Gunakan berus interdental atau pemegang flos setiap hari. Bersihkan gigi palsu seperti dinasihatkan jika anda memakainya.','Memberus terlalu kuat pada akar yang terdedah, dan tidak memberus apabila letih.']]},
zh:{at:'按年龄组的口腔卫生',ad:'六个年龄组，从婴幼儿到老年人，每组都有刷牙指导。',st:'特殊口腔护理',sd:'孕期、牙套、假牙、口干及特殊需要。',gen:'一般指南（适合所有年龄）',more:'更多相关内容',dm:'动画示意图',fg:'有待对照马来西亚卫生部最新指南核实。',nm:['婴幼儿（0–3岁）','学龄前儿童（4–6岁）','学龄儿童（7–12岁）','青少年（13–19岁）','成人（20–59岁）','老年人（60岁及以上）'],q:['我应该多久刷一次牙？','我应该使用哪种牙刷？','我应该用多少牙膏？','牙刷应该怎样放置？','刷牙时应该怎样移动牙刷？','应该清洁牙齿的哪些表面？','怎样清洁牙缝？','需要清洁舌头吗？','应避免哪些常见错误？','什么时候应该看牙医？'],d:['每天刷牙两次，早上和睡前，每次约两分钟。','刷净每颗牙齿的外侧、内侧和咬合面，包括后牙和牙龈线处。','需要。轻轻刷或刮舌头，有助于保持口气清新。','定期看牙医检查；若有疼痛、牙龈出血、肿胀或口腔任何变化，应更早就诊。'],i:['第一颗牙长出后每天刷牙两次。在此之前，用干净湿润的布轻轻擦拭牙龈。','用干净湿润的布轻轻擦拭舌头。','牙齿一长出来就带宝宝首次看牙医，之后定期复诊。'],s:[['柔软的小头婴儿牙刷。牙齿长出之前，用干净湿润的布。','极少量含氟牙膏，约米粒大小，由成人挤放。','舒适地抱着宝宝并托住头部，轻轻掀起嘴唇以看到牙齿。','用轻柔的小圆圈或短距离来回动作，由家长或照护者来刷。','牙齿互相接触后，请向牙科团队询问如何清洁牙缝。','让宝宝含着奶瓶或甜饮料入睡。'],['软毛小头牙刷，刷柄较粗，容易握住。','豌豆大小的含氟牙膏，由家长挤在牙刷上。','把牙刷贴着牙齿和牙龈，由家长协助握住和引导。','在牙齿外侧用轻柔的圆圈动作（Fones 刷牙法），再在内侧和咬合面用来回动作。','牙齿相接处由家长使用牙线，必要时用牙线棒。','自己刷牙而家长没有帮忙刷干净，以及吞下牙膏。'],['软毛小头牙刷，能够刷到后面的磨牙。','豌豆大小的含氟牙膏。吐出泡沫，不要立刻漱口。','让刷毛稍微朝牙龈倾斜。特别留意后面新长出的恒磨牙。','每次按相同顺序刷所有牙面，避免遗漏，动作小而轻柔。','牙齿相接后开始使用牙线，起初由家长协助。','匆忙刷牙、漏刷后面的磨牙、用力过大。'],['软毛小头牙刷。戴牙套者可使用正畸专用牙刷。','豌豆大小的含氟牙膏。','把牙刷放在牙齿与牙龈相接处，刷毛稍微朝牙龈倾斜。','用轻柔的小动作，再朝咬合面方向轻扫（改良巴氏刷牙法）。','每天用牙线或牙缝刷清洁牙缝，包括牙套周围。','用力过大、漏刷牙龈线、经常喝含糖饮料。'],['软毛小头牙刷，电动牙刷也适合。','豌豆大小的含氟牙膏。','把牙刷放在牙齿与牙龈相接处，刷毛稍微朝牙龈倾斜。','用轻柔的小动作和较轻的力度，再朝咬合面方向轻扫（改良巴氏刷牙法）。','每天用牙线或牙缝刷清洁牙缝一次。','用力过大、匆忙刷牙、漏刷牙龈线。'],['软毛牙刷。若握力较弱，请选用较粗或经改装的刷柄，或电动牙刷。','豌豆大小的含氟牙膏。','让刷毛轻轻朝牙龈线倾斜。若手会抖，可把手肘靠在桌上。','用轻柔的小动作和较轻的力度，尤其是牙龈退缩、牙根外露的地方。','每天使用牙缝刷或牙线棒。戴假牙者请按建议清洁假牙。','对外露牙根用力过大，以及疲倦时就不刷牙。']]}};

en:{n:['Dental Implants','Diabetes and Oral Health','Gum Disease (Periodontal Disease)','Oral Cancer Awareness'],sc:'Learn the warning signs and how to examine your own mouth.',sr:'Sources:',m:{16:['Clean around your implant every day, just as you clean your natural teeth. Plaque around an implant can inflame the gums.','Brush twice a day with a soft toothbrush, gently tilting the bristles towards the gum line around the implant.','Clean between the implant and the neighbouring teeth with interdental brushes or implant-friendly floss, in the size your dental team recommends.','Do not use sharp or metal tools on an implant.','Warning signs: red, swollen or bleeding gums around the implant, a bad taste, pus, pain, or a loose implant. See your dentist promptly.','See your dentist for regular check-ups and professional cleaning of the implant. Smoking increases the risk of implant problems.','!References for this topic: pending clinical review by the dental team.'],17:['People with diabetes are more likely to develop gum disease, and gum disease can make blood sugar harder to control.','Good blood sugar control helps protect your gums. Follow your doctor’s advice.','Brush twice a day with fluoride toothpaste and clean between your teeth daily.','Warning signs: red, swollen or bleeding gums, bad breath that does not go away, loose teeth, a dry mouth, or mouth sores that heal slowly.','Tell your dentist that you have diabetes and which medicines you take.','See your dentist regularly. If you smoke, stopping helps your gums.','!References for this topic: pending clinical review by the dental team.'],18:['<b>Healthy gums</b> are pink and firm and do not bleed when you brush. <b>Gingivitis</b> means red, swollen gums that bleed easily; it can be reversed with good cleaning.','<b>Periodontitis</b> is more serious. Signs include gums pulling away from the teeth, persistent bad breath, pus, and loose or moving teeth.','Brush twice a day with a soft toothbrush, gently tilting the bristles towards the gum line, using light pressure.','Clean between your teeth every day with floss or interdental brushes.','Plaque that hardens becomes calculus (tartar), which only a dental professional can remove by scaling.','Smoking makes gum disease worse. See your dentist for scaling and periodontal treatment, and for regular maintenance visits.'],19:['<b>What is oral cancer?</b> Oral cancer is a cancer that can start in the lips, tongue, cheeks, gums, floor of the mouth or roof of the mouth. Changes found early are easier to treat.','<b>Main risk factors:</b> smoking, smokeless tobacco, alcohol, chewing betel quid or areca nut, and HPV infection (mainly at the back of the throat). Using tobacco and alcohol together raises the risk further.','<b>Warning signs:</b> a mouth ulcer that does not heal, a white patch (leukoplakia), a red patch (erythroplakia), a lump or swelling, ongoing pain, bleeding without a clear cause, difficulty swallowing or moving the tongue, or a lump in the neck.','<b>When to seek professional help:</b> see your dentist if any ulcer, patch, lump or other change lasts for more than two weeks. Not every patch or ulcer is cancer, and most mouth ulcers heal by themselves.','<b>Self-mouth examination (SME):</b> do it regularly, for example once a month, in front of a mirror, in good light and with clean hands.','<b>Step 1 – Lips:</b> look at and feel the inside and outside of your upper and lower lips.','<b>Step 2 – Inner cheeks:</b> gently pull out each cheek and check for patches, ulcers or lumps.','<b>Step 3 – Gums:</b> look at the gums of your upper and lower teeth, front and back.','<b>Step 4 – Tongue:</b> stick out your tongue and check the top, both sides and the underside.','<b>Step 5 – Floor of the mouth:</b> lift your tongue and look underneath.','<b>Step 6 – Roof of the mouth:</b> tilt your head back, open wide and look at the roof.','<b>Step 7 – Back of the mouth and throat:</b> look as far back as is comfortable.','<b>Step 8 – Neck:</b> feel both sides of the neck and under the jaw for lumps or swelling.','<b>Remember:</b> self-examination does not replace a professional dental examination. Do not try to diagnose yourself. See your dentist about any suspicious or persistent change.']},w:{16:['Implants do not decay, but the gums around them can become inflamed.','Early inflammation (peri-implant mucositis) can often be reversed with good cleaning.','If it is not treated, it can damage the bone that holds the implant (peri-implantitis).'],17:['High blood sugar makes it harder for the body to fight infection, including in the gums.','Gum infection can raise blood sugar.','Looking after your mouth is part of managing diabetes.'],18:['Gum disease often causes no pain in the early stages.','Plaque control at home and professional cleaning work together.','Untreated periodontitis can lead to tooth loss.']}},
ms:{n:['Implan Gigi','Diabetes dan Kesihatan Mulut','Penyakit Gusi (Penyakit Periodontal)','Kesedaran Kanser Mulut'],sc:'Ketahui tanda amaran dan cara memeriksa mulut anda sendiri.',sr:'Sumber:',m:{16:['Bersihkan sekeliling implan setiap hari, sama seperti membersihkan gigi asli. Plak di sekeliling implan boleh menyebabkan gusi radang.','Berus gigi dua kali sehari dengan berus gigi lembut, dengan bulu dicondongkan dengan lembut ke arah garis gusi di sekeliling implan.','Bersihkan celah antara implan dengan gigi bersebelahan menggunakan berus interdental atau flos yang sesuai untuk implan, dalam saiz yang disyorkan oleh pasukan pergigian anda.','Jangan gunakan alat yang tajam atau berlogam pada implan.','Tanda amaran: gusi merah, bengkak atau berdarah di sekeliling implan, rasa tidak sedap di mulut, nanah, sakit, atau implan goyang. Berjumpa doktor pergigian dengan segera.','Berjumpa doktor pergigian untuk pemeriksaan berkala dan pembersihan implan secara profesional. Merokok meningkatkan risiko masalah implan.','!Rujukan bagi topik ini: menunggu semakan klinikal oleh pasukan pergigian.'],17:['Orang yang menghidap diabetes lebih berisiko mendapat penyakit gusi, dan penyakit gusi boleh menyukarkan kawalan gula dalam darah.','Kawalan gula darah yang baik membantu melindungi gusi anda. Ikut nasihat doktor anda.','Berus gigi dua kali sehari dengan ubat gigi berfluorida dan bersihkan celah gigi setiap hari.','Tanda amaran: gusi merah, bengkak atau berdarah, nafas berbau yang tidak hilang, gigi goyang, mulut kering, atau luka mulut yang lambat sembuh.','Beritahu doktor pergigian anda bahawa anda menghidap diabetes dan ubat-ubatan yang anda ambil.','Berjumpa doktor pergigian secara berkala. Jika anda merokok, berhenti merokok membantu gusi anda.','!Rujukan bagi topik ini: menunggu semakan klinikal oleh pasukan pergigian.'],18:['<b>Gusi yang sihat</b> berwarna merah jambu, tegap dan tidak berdarah apabila memberus. <b>Gingivitis</b> bermaksud gusi merah, bengkak dan mudah berdarah; ia boleh dipulihkan dengan pembersihan yang baik.','<b>Periodontitis</b> lebih serius. Tandanya termasuk gusi yang surut dari gigi, nafas berbau yang berterusan, nanah, dan gigi yang goyang atau berganjak.','Berus gigi dua kali sehari dengan berus gigi lembut, dengan bulu dicondongkan dengan lembut ke arah garis gusi, dan gunakan tekanan ringan.','Bersihkan celah gigi setiap hari dengan flos atau berus interdental.','Plak yang mengeras menjadi karang gigi, yang hanya boleh dibuang oleh profesional pergigian melalui penskalaan.','Merokok memburukkan penyakit gusi. Berjumpa doktor pergigian untuk penskalaan dan rawatan periodontal, serta lawatan penyelenggaraan secara berkala.'],19:['<b>Apakah kanser mulut?</b> Kanser mulut ialah kanser yang boleh bermula pada bibir, lidah, pipi, gusi, lantai mulut atau lelangit. Perubahan yang dikesan awal lebih mudah dirawat.','<b>Faktor risiko utama:</b> merokok, tembakau tanpa asap, alkohol, mengunyah sirih atau pinang, dan jangkitan HPV (terutamanya di bahagian belakang tekak). Menggunakan tembakau dan alkohol bersama-sama meningkatkan lagi risiko.','<b>Tanda amaran:</b> ulser mulut yang tidak sembuh, tompok putih (leukoplakia), tompok merah (eritroplakia), ketulan atau bengkak, sakit yang berterusan, pendarahan tanpa sebab yang jelas, sukar menelan atau menggerakkan lidah, atau ketulan di leher.','<b>Bilakah perlu mendapatkan bantuan profesional:</b> berjumpa doktor pergigian jika sebarang ulser, tompok, ketulan atau perubahan lain berterusan melebihi dua minggu. Bukan semua tompok atau ulser ialah kanser, dan kebanyakan ulser mulut sembuh dengan sendiri.','<b>Pemeriksaan Mulut Sendiri (MSE):</b> lakukan secara berkala, contohnya sekali sebulan, di hadapan cermin, dengan cahaya yang baik dan tangan yang bersih.','<b>Langkah 1 – Bibir:</b> lihat dan raba bahagian dalam dan luar bibir atas dan bawah.','<b>Langkah 2 – Pipi bahagian dalam:</b> tarik setiap pipi dengan lembut dan periksa tompok, ulser atau ketulan.','<b>Langkah 3 – Gusi:</b> lihat gusi pada gigi atas dan bawah, bahagian depan dan belakang.','<b>Langkah 4 – Lidah:</b> julurkan lidah dan periksa permukaan atas, kedua-dua sisi dan bahagian bawah.','<b>Langkah 5 – Lantai mulut:</b> angkat lidah dan lihat di bawahnya.','<b>Langkah 6 – Lelangit:</b> dongakkan kepala, buka mulut luas-luas dan lihat lelangit.','<b>Langkah 7 – Bahagian belakang mulut dan tekak:</b> lihat sejauh yang selesa.','<b>Langkah 8 – Leher:</b> raba kedua-dua belah leher dan bahagian bawah rahang untuk mencari ketulan atau bengkak.','<b>Ingat:</b> pemeriksaan sendiri tidak menggantikan pemeriksaan pergigian profesional. Jangan cuba mendiagnosis sendiri. Berjumpa doktor pergigian untuk sebarang perubahan yang mencurigakan atau berterusan.']},w:{16:['Implan tidak mereput, tetapi gusi di sekelilingnya boleh menjadi radang.','Keradangan awal (mukositis peri-implan) selalunya boleh dipulihkan dengan pembersihan yang baik.','Jika tidak dirawat, ia boleh merosakkan tulang yang menyokong implan (peri-implantitis).'],17:['Gula darah yang tinggi menyukarkan badan melawan jangkitan, termasuk pada gusi.','Jangkitan gusi boleh meningkatkan gula dalam darah.','Menjaga kesihatan mulut ialah sebahagian daripada pengurusan diabetes.'],18:['Penyakit gusi pada peringkat awal selalunya tidak menyebabkan sakit.','Kawalan plak di rumah dan pembersihan profesional berfungsi bersama.','Periodontitis yang tidak dirawat boleh menyebabkan gigi tercabut.']}},
zh:{n:['种植牙','糖尿病与口腔健康','牙龈疾病（牙周病）','口腔癌认知'],sc:'了解警示信号以及如何自我检查口腔。',sr:'资料来源：',m:{16:['每天清洁种植牙周围，就像清洁天然牙一样。种植牙周围的牙菌斑会引起牙龈发炎。','每天用软毛牙刷刷牙两次，让刷毛轻轻朝种植牙周围的牙龈线倾斜。','用牙缝刷或适合种植牙的牙线，按牙科团队建议的尺寸，清洁种植牙与相邻牙齿之间的空隙。','不要在种植牙上使用尖锐或金属工具。','警示信号：种植牙周围牙龈发红、肿胀或出血，口中有异味，流脓、疼痛，或种植牙松动。请尽快看牙医。','定期看牙医检查，并接受种植牙的专业清洁。吸烟会增加种植牙出问题的风险。','!本主题的参考资料：有待牙科团队临床审核。'],17:['糖尿病患者更容易患牙龈疾病，而牙龈疾病也会使血糖更难控制。','良好的血糖控制有助于保护牙龈。请遵从医生的建议。','每天用含氟牙膏刷牙两次，并每天清洁牙缝。','警示信号：牙龈发红、肿胀或出血，持续口臭，牙齿松动，口干，或口腔伤口愈合缓慢。','请告知牙医您患有糖尿病以及正在服用的药物。','定期看牙医。如果吸烟，戒烟有助于保护牙龈。','!本主题的参考资料：有待牙科团队临床审核。'],18:['<b>健康的牙龈</b>呈粉红色、紧实，刷牙时不出血。<b>牙龈炎</b>是指牙龈发红、肿胀、容易出血，通过良好的清洁可以逆转。','<b>牙周炎</b>更严重。症状包括牙龈退缩、持续口臭、流脓，以及牙齿松动或移位。','每天用软毛牙刷刷牙两次，让刷毛轻轻朝牙龈线倾斜，力度要轻。','每天用牙线或牙缝刷清洁牙缝。','牙菌斑变硬后形成牙石，只有牙科专业人员才能通过洁治（洗牙）去除。','吸烟会使牙龈疾病恶化。请看牙医接受洁治和牙周治疗，并定期复诊维护。'],19:['<b>什么是口腔癌？</b>口腔癌可发生在嘴唇、舌头、脸颊、牙龈、口底或上颚。及早发现变化，治疗会更容易。','<b>主要风险因素：</b>吸烟、无烟烟草、饮酒、嚼食槟榔，以及HPV感染（主要见于喉咙后部）。同时使用烟草和酒精会进一步增加风险。','<b>警示信号：</b>久不愈合的口腔溃疡、白色斑块（白斑）、红色斑块（红斑）、肿块或肿胀、持续疼痛、无明显原因的出血、吞咽或活动舌头困难，或颈部肿块。','<b>何时寻求专业帮助：</b>若任何溃疡、斑块、肿块或其他变化持续超过两周，请看牙医。并非所有斑块或溃疡都是癌症，大多数口腔溃疡会自行愈合。','<b>自我口腔检查（SME）：</b>请定期进行，例如每月一次，在镜子前、光线充足、双手清洁的情况下检查。','<b>第1步 – 嘴唇：</b>查看并触摸上下嘴唇的内外侧。','<b>第2步 – 脸颊内侧：</b>轻轻拉开每侧脸颊，检查是否有斑块、溃疡或肿块。','<b>第3步 – 牙龈：</b>查看上下牙齿的牙龈，包括前面和后面。','<b>第4步 – 舌头：</b>伸出舌头，检查舌面、两侧和舌下。','<b>第5步 – 口底：</b>抬起舌头，查看下方。','<b>第6步 – 上颚：</b>头稍向后仰，张大嘴巴，查看上颚。','<b>第7步 – 口腔后部和咽喉：</b>在舒适的范围内尽量往里看。','<b>第8步 – 颈部：</b>触摸颈部两侧和下颌下方，检查是否有肿块或肿胀。','<b>请记住：</b>自我检查不能取代牙医的专业口腔检查。请勿自行诊断。出现可疑或持续的变化时，请看牙医。']},w:{16:['种植牙不会蛀牙，但周围的牙龈可能发炎。','早期炎症（种植体周围黏膜炎）通常可通过良好的清洁得到逆转。','若不治疗，可能破坏支撑种植牙的骨头（种植体周围炎）。'],17:['血糖过高会使身体更难抵抗感染，包括牙龈感染。','牙龈感染可能使血糖升高。','照顾好口腔是糖尿病管理的一部分。'],18:['牙龈疾病早期往往没有疼痛。','在家控制牙菌斑与专业清洁相辅相成。','未经治疗的牙周炎可能导致牙齿脱落。']}}};
